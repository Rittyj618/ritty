<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ritty">
<meta name="theme-color" content="#ff9bb3">
<title>Ritty 的工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<style>
:root{
  --teal:#5ec9bf; --teal-l:#d7f3ef; --teal-d:#3aa79c;
  --pink:#f7a8c9; --pink-l:#fde3ee; --purple:#b79ced; --purple-l:#ece3fb;
  --cream:#fdf9f3; --ink:#4d4a5c; --ink-2:#8b88a0; --line:#f0e8de;
  --red:#f08c8c; --yellow:#ffd98a; --card:#ffffff;
  --r:18px; --shadow:0 4px 14px rgba(150,130,180,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); background:var(--cream);
  background-image:
    radial-gradient(rgba(247,168,201,.28) 8%, transparent 9%),
    radial-gradient(rgba(94,201,191,.20) 8%, transparent 9%);
  background-size:46px 46px,46px 46px;
  background-position:0 0,23px 23px;
  overscroll-behavior:none;
}
/* ---------- 左侧导航（日常隐藏抽屉） ---------- */
#nav{
  position:fixed;left:0;top:0;bottom:0;width:76px;z-index:90;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-right:2px dashed var(--line);border-radius:0 22px 22px 0;
  display:flex;flex-direction:column;align-items:center;
  padding:max(12px, env(safe-area-inset-top)) 0 max(12px, env(safe-area-inset-bottom));gap:2px;overflow-y:auto;
  transform:translateX(-105%);
  transition:transform .32s cubic-bezier(.22,1.1,.36,1);
  box-shadow:6px 0 24px rgba(150,130,180,.12);
}
#nav.open{transform:translateX(0)}
#navmask{
  position:fixed;inset:0;z-index:80;background:rgba(80,70,110,.18);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
#navmask.on{opacity:1;pointer-events:auto}
.logo{
  width:50px;height:50px;border-radius:17px;margin-bottom:2px;flex:none;
  background:linear-gradient(135deg,var(--teal-l),var(--pink-l));
  display:flex;align-items:center;justify-content:center;font-size:26px;
  border:2px solid #fff;box-shadow:var(--shadow);cursor:pointer;transition:.2s;
}
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px;cursor:pointer}
.logo-wrap span{font-size:10px;color:var(--ink-2);letter-spacing:1px}
.logo-wrap.on .logo{transform:scale(1.06);background:linear-gradient(135deg,#fff3c9,#ffe1ef)}
.logo-wrap.on span{color:var(--ink);font-weight:700}
.nav-btn{
  width:56px;padding:7px 0 6px;border:none;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px;
  color:var(--ink-2);flex:none;position:relative;overflow:hidden;
  transition:transform .18s cubic-bezier(.22,1,.36,1),background .18s;
  animation:navIn .35s cubic-bezier(.22,1,.36,1) both;
}
.nav-btn:nth-child(2){animation-delay:.03s}
.nav-btn:nth-child(3){animation-delay:.06s}
.nav-btn:nth-child(4){animation-delay:.09s}
.nav-btn:nth-child(5){animation-delay:.12s}
.nav-btn:nth-child(6){animation-delay:.15s}
.nav-btn:nth-child(7){animation-delay:.18s}
@keyframes navIn{from{opacity:0;transform:translateX(-16px) scale(.9)}to{opacity:1;transform:none}}
.nav-btn:hover{transform:translateY(-2px)}
.nav-btn:active{transform:scale(.92)}
.nav-btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,transparent 70%);transform:scale(0);transition:transform .35s}
.nav-btn:active::after{transform:scale(2.2);opacity:0;transition:transform .35s,opacity .35s}
.nav-ic{
  width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:#f6f2fa;transition:.22s cubic-bezier(.22,1,.36,1);border:2px solid transparent;
}
.nav-btn:hover .nav-ic{transform:translateY(-2px) scale(1.06);box-shadow:0 4px 10px rgba(150,130,180,.14)}
.nav-btn span{font-size:10px;letter-spacing:1px;transition:.15s}
.nav-btn.on{color:var(--ink)}
.nav-btn.on span{font-weight:700}
.nav-btn.on .nav-ic{transform:scale(1.08);border-color:#fff;box-shadow:var(--shadow)}
.nav-btn[data-p="exam"].on .nav-ic{background:linear-gradient(135deg,#d7f3ef,#bfe9ff)}
.nav-btn[data-p="eng"].on .nav-ic{background:linear-gradient(135deg,#ece3fb,#dcd2ff)}
.nav-btn[data-p="fit"].on .nav-ic{background:linear-gradient(135deg,#ffe3ec,#ffd6e5)}
.nav-btn[data-p="diet"].on .nav-ic{background:linear-gradient(135deg,#e5f8d8,#d2f2e6)}
.nav-btn[data-p="hobby"].on .nav-ic{background:linear-gradient(135deg,#fde3ee,#ece3fb)}
.nav-btn[data-p="money"].on .nav-ic{background:linear-gradient(135deg,#fff0cd,#ffe4c9)}
/* ---------- 主区域 ---------- */
#main{margin:0 auto;padding:max(16px, env(safe-area-inset-top)) 14px 90px;max-width:560px}
.page{display:none;animation:fadein .25s}
.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
.sub{color:var(--ink-2);font-size:12px;margin-top:3px}
.head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.head .ht{flex:1}
/* 页面左上角头像按钮：点击弹出导航 */
.pgo{
  width:48px;height:48px;flex:none;border-radius:16px;cursor:pointer;
  background:linear-gradient(135deg,var(--teal-l),var(--pink-l));
  border:2px solid #fff;box-shadow:var(--shadow);font-size:24px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s;position:relative;
}
.pgo:active{transform:scale(.92)}
.pgo::after{
  content:"≡";position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;
  border-radius:50%;background:var(--pink);color:#fff;font-size:11px;line-height:16px;
  text-align:center;border:1.5px solid #fff;
}
/* 卡片 */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1.5px solid #fff}
.card h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dotline{height:6px;border-radius:3px;margin:6px 0 14px;
  background-image:radial-gradient(var(--pink) 34%,transparent 36%);background-size:12px 6px;opacity:.5}
/* 顶部三统计 */
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.stat{border-radius:16px;padding:12px 6px;text-align:center;border:1.5px solid #fff;box-shadow:var(--shadow)}
.stat b{font-size:22px;display:block}
.stat i{font-style:normal;font-size:11px;color:var(--ink-2)}
.st-todo{background:linear-gradient(150deg,#e8fbf7,#d7f3ef)}
.st-done{background:linear-gradient(150deg,#f4edff,#ece3fb)}
.st-over{background:linear-gradient(150deg,#fff0f0,#ffe2e2)}
.st-todo b{color:var(--teal-d)}.st-done b{color:#8a68d8}.st-over b{color:var(--red)}
/* 试卷录入紧凑布局 */
.paper-top{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-bottom:4px}
.paper-top .fld{margin-bottom:0}
.paper-top .fld.wide{grid-column:1 / -1}
.paper-top .fld input,.paper-top .fld select{padding:6px 9px;font-size:12px;border-radius:9px}
.paper-sec{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:4px 0 6px}
.paper-sec .fld{margin-bottom:0}
.paper-sec .fld label{font-size:10px;margin-bottom:2px}
.paper-sec .fld input{padding:6px 9px;font-size:12px;border-radius:9px}
.paper-notes{margin-top:2px}
.paper-notes .fld textarea{padding:6px 9px;font-size:12px;border-radius:9px;min-height:44px;line-height:1.4}
.paper-sec-title{font-size:11.5px;color:var(--ink-2);font-weight:700;margin:6px 0 3px;display:flex;align-items:center;gap:4px}
.paper-sec-title::before,.paper-sec-title::after{content:'';flex:1;height:1.5px;background:repeating-linear-gradient(90deg,#efe4fa 0 4px,transparent 4px 7px)}
/* 任务 */
.task{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1.5px dashed var(--line)}
.task:last-child{border-bottom:none}
.ck{width:22px;height:22px;flex:none;border-radius:8px;border:2px solid var(--teal);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer}
.task.done .ck{background:var(--teal);border-color:var(--teal)}
.task.done .t-title{text-decoration:line-through;color:var(--ink-2)}
.t-title{font-size:14px;flex:1;word-break:break-all}
.t-tag{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--purple-l);color:#7d5fc9;flex:none}
.t-date{font-size:10px;color:var(--ink-2);flex:none}
.t-date.over{color:var(--red);font-weight:700}
.del{border:none;background:none;color:#d9d2e8;font-size:15px;cursor:pointer;padding:2px;flex:none}
/* 模块卡片网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mcard{border-radius:var(--r);padding:13px;border:1.5px solid #fff;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.mcard .mi{font-size:22px}
.mcard b{display:block;font-size:14px;margin:5px 0 2px}
.mcard p{font-size:11px;color:var(--ink-2);line-height:1.5}
.mcard em{font-style:normal;font-weight:700;color:var(--ink)}
.mcard::after{content:"";position:absolute;right:-14px;top:-14px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.55)}
.mc1{background:linear-gradient(140deg,#e4f7ff,#d7f3ef)} .mc2{background:linear-gradient(140deg,#f0e8ff,#ece3fb)}
.mc3{background:linear-gradient(140deg,#ffe9f1,#ffdfe9)} .mc4{background:linear-gradient(140deg,#eefbe0,#dcf5ea)}
.mc5{background:linear-gradient(140deg,#fde3ee,#f3e8fd)} .mc6{background:linear-gradient(140deg,#fff3d6,#ffe8cf)}
/* 子导航 tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;cursor:pointer;padding:7px 13px;border-radius:99px;font-size:12.5px;
  background:#fff;color:var(--ink-2);box-shadow:var(--shadow);display:flex;align-items:center;gap:5px;border:1.5px solid transparent}
.tab.on{background:linear-gradient(120deg,var(--teal-l),var(--purple-l));color:var(--ink);font-weight:700;border-color:#fff}
/* 按钮 */
.btn{border:none;cursor:pointer;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:700;
  background:linear-gradient(120deg,var(--teal),#7ed6cd);color:#fff;box-shadow:0 4px 10px rgba(94,201,191,.35)}
.btn.pk{background:linear-gradient(120deg,var(--pink),#f9bcd6);box-shadow:0 4px 10px rgba(247,168,201,.35)}
.btn.pp{background:linear-gradient(120deg,var(--purple),#c9b3f5);box-shadow:0 4px 10px rgba(183,156,237,.35)}
.btn.ghost{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal-l);box-shadow:none}
.btn.sm{padding:4px 9px;font-size:11px}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.rowline h3{flex:1;margin:0;font-size:13px}
/* 进度条 */
.bar{height:12px;border-radius:99px;background:#f2edf8;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--purple));transition:.3s}
.bar.pink i{background:linear-gradient(90deg,var(--pink),var(--purple))}
/* 列表项 */
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1.5px dashed var(--line);font-size:13px}
.li:last-child{border-bottom:none}
.li small{color:var(--ink-2);font-size:11px;display:block;margin-top:2px}
.pill{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--teal-l);color:var(--teal-d);flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1;height:20px;box-sizing:border-box;font-weight:700;white-space:nowrap}
.pill.pk{background:var(--pink-l);color:#e0699e}
.pill.pp{background:var(--purple-l);color:#8a68d8}
.pill.yl{background:#fff3d6;color:#d29a3a}
.pill.hot{background:linear-gradient(120deg,var(--pink-l),var(--purple-l));color:#8a68d8}
.pill.on{background:linear-gradient(120deg,var(--teal-l),#d7f3ef);color:var(--teal-d)}
/* 推送状态横幅（自动化失败提醒） */
.banner{display:flex;align-items:center;gap:8px;font-size:12px;padding:10px 12px;border-radius:12px;margin-bottom:12px;line-height:1.5}
.banner.warn{background:#fff3d6;color:#b07a1f;border:1.5px solid #ffe3a8}
.banner.ok{background:var(--teal-l);color:var(--teal-d);border:1.5px solid #cdeee8}
.amount-in{color:var(--red);font-weight:700}
.amount-out{color:#3aa79c;font-weight:700}
.empty{text-align:center;color:#c9c3d8;font-size:12px;padding:22px 0}
.empty b{font-size:26px;display:block;margin-bottom:6px}
/* 倒计时 */
.count{background:linear-gradient(135deg,#d7f3ef,#ece3fb);border-radius:var(--r);padding:18px 14px;text-align:center;
  border:1.5px solid #fff;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
.count::before,.count::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.5)}
.count::before{width:70px;height:70px;left:-22px;top:-22px}
.count::after{width:90px;height:90px;right:-30px;bottom:-38px}
.count b{font-size:40px;color:var(--teal-d)}
.count .cn{font-size:13px;font-weight:700;margin-bottom:3px}
.count i{font-style:normal;font-size:11px;color:var(--ink-2);display:block;margin-top:2px}
/* 水杯 */
.cups{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:6px 0}
.cup{width:44px;height:52px;border-radius:10px 10px 14px 14px;border:2.5px solid var(--teal-l);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;transition:.2s;opacity:.55}
.cup.full{background:linear-gradient(180deg,#d7f3ef 20%,#a5e3db);border-color:var(--teal);opacity:1;transform:scale(1.05)}
/* 图表 */
.bars7{display:flex;align-items:flex-end;gap:7px;height:90px;padding-top:6px}
.b7{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.b7 i{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--pink),var(--purple));min-height:3px}
.b7.teal i{background:linear-gradient(180deg,var(--teal),#9adfd7)}
.b7 span{font-size:9px;color:var(--ink-2)}
.b7 em{font-style:normal;font-size:9px;color:var(--ink-2)}
svg.trend{width:100%;height:110px}
/* 模态框 */
#mask{position:fixed;inset:0;background:rgba(80,70,110,.35);z-index:99;display:none;align-items:flex-end;justify-content:center}
#mask.on{display:flex}
#modal{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px 26px;animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
#modal h3{font-size:16px;margin-bottom:14px;text-align:center}
.fld{margin-bottom:11px}
.fld label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;
  background:#fdfbf8;color:var(--ink);outline:none;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal)}
.m-btns{display:flex;gap:10px;margin-top:16px}
.m-btns .btn{flex:1;padding:12px}
.fld-calc{
  width:100%;border:2px dashed var(--pink);border-radius:12px;
  padding:10px 12px;font-size:20px;font-weight:700;text-align:center;
  background:linear-gradient(135deg,var(--pink-l),var(--purple-l));
  color:#e0699e;transition:all .25s cubic-bezier(.22,1.4,.36,1);
}
.fld-calc.up{color:var(--teal-d);border-color:var(--teal);background:linear-gradient(135deg,var(--teal-l),#fff)}
/* toast */
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(77,74,92,.92);color:#fff;
  padding:9px 18px;border-radius:99px;font-size:13px;z-index:120;display:none;white-space:nowrap}
/* 浮动加号 */
#fab{position:fixed;right:18px;bottom:max(24px, env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:none;z-index:60;
  background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:26px;cursor:pointer;
  box-shadow:0 6px 16px rgba(183,156,237,.45)}
.gear{border:none;background:#fff;border-radius:12px;width:36px;height:36px;font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
.mini-stats{display:flex;gap:10px}
.mini{flex:1;text-align:center;background:#faf7ff;border-radius:14px;padding:10px 4px}
.mini b{font-size:17px;display:block}
.mini i{font-style:normal;font-size:10px;color:var(--ink-2)}
.subj{margin-bottom:11px}
.subj .rowline{margin-bottom:5px;font-size:13px}
.wish-ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--pink);flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.wish.done .wish-ck{background:var(--pink)}
.wish.done .w-t{text-decoration:line-through;color:var(--ink-2)}
.catbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.catbar .bar{flex:1}
.catbar b{width:56px;text-align:right;flex:none;font-size:11px}
.catbar span{width:52px;flex:none}
input[type="file"]{display:none}
/* ---------- 上岸模块：底部功能导航 ---------- */
#exambar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;gap:1px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-top:2px dashed var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -6px 20px rgba(150,130,180,.16);
  padding:5px 4px max(5px,env(safe-area-inset-bottom))}
body.exam-on #exambar{display:flex}
body.exam-on #fab{display:none}
body.exam-on #main{padding-bottom:140px}
.eb{flex:1;min-width:0;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink-2);padding:2px 0}
.eb i{font-style:normal;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:#f6f2fa;border:2px solid transparent;transition:.2s}
.eb span{font-size:9px;letter-spacing:.3px}
.eb.on{color:var(--ink)}
.eb.on span{font-weight:700}
.eb.on i{background:linear-gradient(135deg,var(--teal-l),var(--purple-l));border-color:#fff;box-shadow:var(--shadow);transform:scale(1.08)}
/* 打卡日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;align-items:center}
.cal .cw{font-size:10px;color:var(--ink-2)}
.cd{aspect-ratio:1;border-radius:12px;background:#faf7ff;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid transparent}
.cd em{font-style:normal;font-size:8.5px;color:var(--teal-d);font-weight:700}
.cd.on{background:linear-gradient(135deg,#d7f3ef,#ece3fb);border-color:#fff;box-shadow:var(--shadow)}
.cd.td{border-color:var(--pink)}
/* 滚轴选择器 */
.wheelwrap{position:relative;height:180px;margin:6px 0}
.wheel{height:180px;overflow-y:auto;scroll-snap-type:y mandatory;text-align:center}
.wheel::-webkit-scrollbar{display:none}
.wv{height:36px;line-height:36px;scroll-snap-align:center;font-size:19px;color:var(--ink-2);font-weight:700}
.wsp{height:72px}

.bigbtns{display:flex;gap:10px;justify-content:flex-end;margin-bottom:6px}
.bigbtn{border:none;border-radius:18px;padding:10px 14px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(183,156,237,.3);display:flex;align-items:center;gap:5px;transition:transform .15s,box-shadow .2s}

/* 背诵卡片 */
.rec-card{border-radius:14px;padding:12px;background:#fdfbf8;border:1.5px solid #f0e6f5;margin-bottom:10px;transition:transform .18s,box-shadow .18s}

/* 规范词卡片精简 */

.norm-card .norm-tg{margin:4px 0}
/* 拍照上传行 */
.file-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.filebtn{border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;background:#fff;color:var(--ink);cursor:pointer;flex:none}
.filebtn:active{background:#faf7ff}
#modal{max-height:88vh;overflow-y:auto}

/* ========== 动画系统 ========== */
/* 页面切换 */
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 卡片stagger */
@keyframes cardPop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

/* 按钮反馈 */
@keyframes btnPress{0%{transform:scale(1)}40%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes ripple{0%{transform:scale(0);opacity:.5}100%{transform:scale(2.5);opacity:0}}

/* 浮动 */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes floatSlow{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(2deg)}}

/* 脉冲 */
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(183,156,237,.4)}50%{box-shadow:0 0 0 8px rgba(183,156,237,0)}}
@keyframes pulseTeal{0%,100%{box-shadow:0 0 0 0 rgba(94,201,191,.4)}50%{box-shadow:0 0 0 8px rgba(94,201,191,0)}}

/* 数字跳动 */
@keyframes countPop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

/* 摇晃 */
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* 旋转 */
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* 扫描线 */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* 应用动画的类 */
.anim-slide{animation:slideIn .35s cubic-bezier(.22,1,.36,1)}
.anim-slideup{animation:slideUp .4s cubic-bezier(.22,1,.36,1)}
.anim-scale{animation:scaleIn .3s cubic-bezier(.22,1,.36,1)}
.anim-fade{animation:fadeIn .25s ease}

/* 卡片带stagger延迟 */
.card{animation:cardPop .35s cubic-bezier(.22,1,.36,1) both}
.card:nth-child(1){animation-delay:.0s}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}
.card:nth-child(5){animation-delay:.16s}
.card:nth-child(6){animation-delay:.20s}
.card:nth-child(7){animation-delay:.24s}
.card:nth-child(8){animation-delay:.28s}

/* 模块卡片 */
.mcard{transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
.mcard:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 8px 24px rgba(150,130,180,.18)}
.mcard:active{transform:scale(.96)}

/* 按钮 */
.btn{transition:transform .15s,box-shadow .2s,filter .2s;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.4) 0%,transparent 70%);transform:scale(0);transition:transform .3s;border-radius:inherit}
.btn:active{transform:scale(.94)}
.btn:active::after{transform:scale(2)}

/* 导航按钮 */
.nav-btn,.eb{transition:transform .15s}
.nav-btn:active,.eb:active{transform:scale(.9)}

/* 任务项 */
.task{transition:background .2s,transform .2s}
.task:active{transform:translateX(3px)}

/* 浮动按钮 */
#fab{animation:pulse 2s infinite;transition:transform .2s,box-shadow .2s}
#fab:hover{transform:scale(1.08);box-shadow:0 8px 24px rgba(183,156,237,.5)}
#fab:active{transform:scale(.9);animation:none}

/* logo */
.logo{animation:float 3s ease-in-out infinite}
.logo-wrap:hover .logo{animation:none;transform:scale(1.1) rotate(-5deg)}

/* 统计数字 */
.stat b{transition:transform .2s}
.stat:active b{animation:countPop .3s}

/* 水杯 */
.cup{transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.cup:active{transform:scale(.85) rotate(-5deg)}

/* tab */
.tab{transition:transform .15s,box-shadow .2s}
.tab:active{transform:scale(.95)}

/* 删除按钮 */
.del{transition:transform .15s,color .2s}
.del:hover{color:var(--red);transform:scale(1.2)}

/* 空状态 */
.empty b{animation:floatSlow 4s ease-in-out infinite}

/* 倒计时装饰 */
.count::before{animation:float 5s ease-in-out infinite}
.count::after{animation:float 7s ease-in-out infinite reverse}

/* 复选框 */
.ck{transition:background .2s,transform .2s,border-color .2s}
.ck:active{transform:scale(.85)}

/* 输入框焦点 */
.fld input,.fld select,.fld textarea{transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:0 0 0 3px rgba(94,201,191,.15)}

/* 进度条 */
.bar i{transition:width .6s cubic-bezier(.22,1,.36,1)}

/* 图片预览 */
#imgview{transition:opacity .25s}
#imgview img{transition:transform .3s}
#imgview.on img{transform:scale(1)}

/* 日历格 */
.cd{transition:transform .15s,box-shadow .2s}
.cd:active{transform:scale(.92)}

/* 知识点卡片 */
.subj-card{transition:transform .2s,box-shadow .2s}
.subj-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(150,130,180,.15)}
.subj-card:active .subj-ic{animation:iconPress .35s cubic-bezier(.22,1,.36,1)}
@keyframes iconPress{0%{transform:scale(1)}40%{transform:scale(.82)}70%{transform:scale(1.08)}100%{transform:scale(1)}}

/* 方法卡片 */
.method-card{transition:transform .2s}
.method-card:hover{transform:translateX(4px)}

/* 滚轴 */
.wheel{scroll-behavior:smooth}

/* 模态框 */
#mask{transition:opacity .25s}
#modal{transition:transform .3s cubic-bezier(.22,1,.36,1)}

/* toast */
#toast{transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.hide{opacity:0;transform:translateX(-50%) translateY(10px)}

/* 科目详情头部 */
.subj-head{animation:slideIn .4s cubic-bezier(.22,1,.36,1)}

/* 抽认卡 */
.flip-card{transition:transform .5s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-front,.flip-back{backface-visibility:hidden}
.flip-back{transform:rotateY(180deg)}

/* 加载骨架 */
.skeleton{background:linear-gradient(90deg,#f0e8de 25%,#faf7ff 50%,#f0e8de 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}

/* 滚动条美化 */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--pink)}
/* ===== 启动页 ===== */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(150deg,#fff1f6 0%,#fde3ee 40%,#ece3fb 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .5s ease,visibility .5s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{
  width:92px;height:92px;border-radius:28px;flex:none;
  background:linear-gradient(135deg,#fff3f7,#fde3ee);
  border:3px solid #fff;box-shadow:0 8px 24px rgba(247,168,201,.28);
  display:flex;align-items:center;justify-content:center;font-size:46px;
  animation:splashPop .7s cubic-bezier(.22,1.4,.36,1) both,splashFloat 2.4s ease-in-out .7s infinite;
}
@keyframes splashPop{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.12) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes splashFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.splash-title{
  margin-top:18px;font-size:18px;font-weight:800;color:#4d4a5c;letter-spacing:2px;
  opacity:0;animation:splashFade .6s ease .35s forwards;
}
.splash-sub{
  margin-top:5px;font-size:11px;color:#b79ced;letter-spacing:1px;
  opacity:0;animation:splashFade .6s ease .5s forwards;
}
@keyframes splashFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.splash-dots{display:flex;gap:7px;margin-top:24px}
.splash-dots i{
  width:7px;height:7px;border-radius:50%;background:#f7a8c9;flex:none;
  animation:splashDot 1.1s ease-in-out infinite;
}
.splash-dots i:nth-child(2){background:#b79ced;animation-delay:.18s}
.splash-dots i:nth-child(3){background:#5ec9bf;animation-delay:.36s}
@keyframes splashDot{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<script>
/* ================= 数据 ================= */
var KEY='ritty-data-v1';
var DEFAULT_DATA={
  tasks:[],
  exam:{v2:1,exams:[],mastery:{},drills:[],plans:[],dayplans:[],mistakes:[],checkins:{},papers:[],recite:[],accu:[],subjTime:[],learned:[],subjGoals:{},norms:[]},
  eng:{goal:20,checkins:{},words:[],practices:[]},
  fit:{workouts:[],weights:[],goal:{weight:'',weekly:150}},
  diet:{meals:[],water:{},waterGoal:8},
  hobby:{list:[],logs:[],wishes:[]},
  money:{records:[],budget:2000,savings:[]}
};
var S;
try{ S=JSON.parse(localStorage.getItem(KEY))||null; }catch(e){ S=null; }
if(!S) S=JSON.parse(JSON.stringify(DEFAULT_DATA));
// 补齐字段（兼容旧数据）
(function fix(){
  var d=DEFAULT_DATA;
  for(var k in d){ if(S[k]===undefined) S[k]=JSON.parse(JSON.stringify(d[k])); }
})();
// 上岸模块 v2 迁移（兼容旧数据 & 导入的旧备份）
function migrateExam(){
  if(S.exam&&S.exam.v2){
    var d=DEFAULT_DATA.exam;
    for(var k in d){ if(S.exam[k]===undefined)S.exam[k]=JSON.parse(JSON.stringify(d[k])); }
    // 旧版「常识」积累分类 key 为 cs，新版改为 cx，避免与「常识」科目 key 冲突
    (S.exam.accu||[]).forEach(function(a){ if(a.cat==='cs')a.cat='cx'; });
    (S.exam.recite||[]).forEach(function(r){ if(r.cat==='cs')r.cat='cx'; });
    (S.exam.learned||[]).forEach(function(x){ if(x.cat==='cs')x.cat='cx'; });
    return;
  }
  var old=S.exam||{};
  var ne=JSON.parse(JSON.stringify(DEFAULT_DATA.exam));
  if(old.date) ne.exams.push({id:uid(),name:old.name||'上岸目标',date:old.date});
  (old.mistakes||[]).forEach(function(m){ ne.mistakes.push({id:m.id||uid(),date:today(),subj:'',q:m.q||'',a:'',think:m.note||'',imgs:[],audios:[],ok:!!m.ok}); });
  (old.logs||[]).forEach(function(l){ var d2=l.date; ne.checkins[d2]=Math.round(((ne.checkins[d2]||0)+(l.minutes*1||0)/60)*10)/10; });
  S.exam=ne;
}
migrateExam();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('存储快满啦！建议导出备份后删些图片/录音'); } }

var MODS={exam:{n:'上岸',ic:'🌊'},eng:{n:'英语',ic:'🔤'},fit:{n:'健身',ic:'💪'},diet:{n:'饮食',ic:'🥗'},hobby:{n:'爱好',ic:'🎨'},money:{n:'理财',ic:'💰'}};
var cur='home';
var tabState={exam:0,eng:0,fit:0,diet:0,hobby:0,money:0};

/* ================= 工具 ================= */
function $(id){return document.getElementById(id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtD(s){ if(!s)return''; var p=s.split('-'); return p[1]*1+'月'+p[2]*1+'日'; }
function toast(m){ var t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none'},1600); }
function monthStr(){ return today().slice(0,7); }
function daysAgoStr(n){ var d=new Date(); d.setDate(d.getDate()-n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekDates(){ var a=[]; for(var i=6;i>=0;i--)a.push(daysAgoStr(i)); return a; }

/* ================= 模态框 ================= */
var mCb=null;
function showModal(title,fields,cb,okText){
  mCb=cb;
  var h='<h3>'+esc(title)+'</h3>';
  fields.forEach(function(f){
    h+='<div class="fld'+(f.cls?' '+f.cls:'')+'"><label>'+esc(f.label)+'</label>';
    if(f.type==='readonly'||f.type==='calc'){
      h+='<div id="mf-'+f.key+'" class="fld-calc" data-fn="'+esc(f.calcFn||'')+'" data-src="'+esc(f.srcKeys||'')+'">'+esc(f.value||'')+'</div>';
    }else if(f.type==='select'){
      h+='<select id="mf-'+f.key+'">';
      f.options.forEach(function(o){
        var v=typeof o==='string'?o:o.v, t=typeof o==='string'?o:o.t;
        h+='<option value="'+esc(v)+'"'+(f.value===v?' selected':'')+'>'+esc(t)+'</option>';
      });
      h+='</select>';
    }else if(f.type==='textarea'){
      h+='<textarea id="mf-'+f.key+'" rows="3" placeholder="'+esc(f.ph||'')+'">'+esc(f.value||'')+'</textarea>';
    }else{
      h+='<input id="mf-'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.ph||'')+'"'+(f.step?' step="'+f.step+'"':'')+'>';
    }
    h+='</div>';
  });
  h+='<div class="m-btns"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn pk" onclick="okModal()">'+(okText||'保存 ♡')+'</button></div>';
  $('modal').innerHTML=h;
  $('modal')._fields=fields;
  // 绑定事件：当源字段变化时，自动重算 readonly/calc 字段
  fields.forEach(function(f){
    if(f.type==='readonly'||f.type==='calc'){
      var el=$('mf-'+f.key);
      if(el&&f.srcKeys&&f.calcFn){
        var keys=f.srcKeys.split(',');
        keys.forEach(function(k){
          var src=$('mf-'+k);
          if(src){
            src.addEventListener('input',function(){
              var vals={};
              fields.forEach(function(x){ var s=$('mf-'+x.key); if(s)vals[x.key]=s.value; });
              var result=eval(f.calcFn)(vals);
              el.textContent=result;
            });
          }
        });
      }
    }
  });
  $('mask').classList.add('on');
}
function okModal(){
  var vals={}, fs=$('modal')._fields;
  fs.forEach(function(f){
    var el=$('mf-'+f.key);
    if(el){
      if(f.type==='readonly'||f.type==='calc') vals[f.key]=el.textContent.trim();
      else vals[f.key]=el.value.trim();
    }
  });

function taskStats(){
  var t=today(), td=0,dn=0,ov=0;
  S.tasks.forEach(function(k){
    if(k.done){ if(k.date===t)dn++; }
    else{ if(k.date===t)td++; else if(k.date&&k.date<t)ov++; }
  });
  S.exam.dayplans.forEach(function(p){
    if(p.done){ if(p.date===t)dn++; }
    else{ if(p.date===t)td++; else if(p.date&&p.date<t)ov++; }
  });
  return {todo:td,done:dn,over:ov};
}
function taskHtml(k){
  var t=today(), over=!k.done&&k.date&&k.date<t;
  return '<div class="task'+(k.done?' done':'')+'">'
    +'<div class="ck" onclick="tgTask(\''+k.id+'\')">'+(k.done?'✓':'')+'</div>'
    +'<div class="t-title">'+esc(k.title)+'</div>'
    +'<span class="t-tag">'+MODS[k.mod].ic+MODS[k.mod].n+'</span>'
    +'<span class="t-date'+(over?' over':'')+'">'+(over?'逾期 ':'')+fmtD(k.date)+'</span>'
    +'<button class="del" onclick="rmTask(\''+k.id+'\')">✕</button></div>';

function lineSvg(vals,labels,color){
  if(!vals.length) return emptyHtml('📈','暂无数据');
  var W=320,H=130,pad=16;
  var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
  if(max===min){ max+=1; min=Math.max(0,min-1); }
  var step=vals.length>1?(W-2*pad)/(vals.length-1):0;
  var pts=vals.map(function(v,i){ return [pad+i*step, H-24-((v-min)/(max-min))*(H-52)]; });
  var poly=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var h='<svg class="trend" viewBox="0 0 320 130" style="height:130px">';
  h+='<polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  var lb=Math.max(1,Math.ceil(vals.length/8));
  pts.forEach(function(p,i){
    h+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="#fff" stroke="'+color+'" stroke-width="2"/>';
    if(i%lb===0||i===pts.length-1) h+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]-7).toFixed(1)+'" font-size="8.5" fill="#8b88a0" text-anchor="middle">'+vals[i]+'</text>';
  });
  labels.forEach(function(t,i){
    if(t) h+='<text x="'+(pad+i*step).toFixed(1)+'" y="127" font-size="8" fill="#b7b3c9" text-anchor="middle">'+t+'</text>';
  });
  return h+'</svg>';
}

function dpTg(id){
  S.exam.dayplans.forEach(function(p){
    if(p.id===id){
      p.done=!p.done;
      if(p.planId){
        var pl=null; S.exam.plans.forEach(function(x){if(x.id===p.planId)pl=x});
        if(pl){
          if(p.done && !p.pCounted){ pl.done=Math.min(pl.total*1,pl.done*1+(p.n||1)); p.pCounted=true; }
          else if(!p.done && p.pCounted){ pl.done=Math.max(0,pl.done*1-(p.n||1)); p.pCounted=false; }
        }
      }
    }
  });
  render();
}

    {key:'subj',label:'科目',type:'select',options:subjOpts(false),value:prefill||''},
    {key:'type',label:'类型',type:'select',options:[{v:'course',t:'🎬 网课计划'},{v:'drill',t:'✏️ 刷题本计划'}]},
    {key:'name',label:'计划名称',ph:'例如：资料分析专项 1000 题'},
    {key:'total',label:'总量（网课 = 节数 / 刷题本 = 题数）',type:'number',ph:'100'}
  ],function(v){
    if(!v.name||!(v.total*1>0)){toast('名称和总量要填哦');return false}
    S.exam.plans.push({id:uid(),subj:v.subj,type:v.type,name:v.name,total:v.total*1,done:0});
    render(); toast('计划已建立，冲！🚀');
  });
}
function editPlan(id){
  var p=null; S.exam.plans.forEach(function(x){if(x.id===id)p=x});
  if(!p)return;
  showModal('编辑学习计划 ✏️',[
    {key:'subj',label:'科目',type:'select',options:subjOpts(false),value:p.subj},
    {key:'type',label:'类型',type:'select',options:[{v:'course',t:'🎬 网课计划'},{v:'drill',t:'✏️ 刷题本计划'}],value:p.type},
    {key:'name',label:'计划名称',ph:'例如：资料分析专项 1000 题',value:p.name},
    {key:'total',label:'总量（网课 = 节数 / 刷题本 = 题数）',type:'number',ph:'100',value:p.total}
  ],function(v){
    if(!v.name||!(v.total*1>0)){toast('名称和总量要填哦');return false}
    p.subj=v.subj; p.type=v.type; p.name=v.name; p.total=v.total*1;
    render(); toast('计划已更新 ✏️');
  });
}
function planAdd(id){
  var p=null; S.exam.plans.forEach(function(x){if(x.id===id)p=x});
  if(!p)return;
  if(p.type==='course'){ p.done=Math.min(p.total*1,p.done*1+1); render(); toast('网课 +1 节 🎬'); }
  else{
    showModal('补记刷题进度 ✏️',[{key:'n',label:'这次刷了多少题',type:'number',ph:'20'}],function(v){
      if(!(v.n*1>0))return false;
      p.done=Math.min(p.total*1,p.done*1+v.n*1); render(); toast('进度 +'+v.n+' 📈');
    });
  }
}

function openTimeLog(ds){
  wheelDate=ds; mCb=null;
  var h='<h3>📆 '+ds+' · 学习打卡</h3>'
    +subjSelHtml('time-subj',false,'')
    +'<div class="wheelwrap"><div class="wheel" id="wheel"><div class="wsp"></div>';
  for(var v=0.5;v<=16;v+=0.5) h+='<div class="wv">'+Math.round(v*10)/10+'</div>';
  h+='<div class="wsp"></div></div><div class="wheelline"></div><span class="wheelunit">小时</span></div>';
  h+='<div class="m-btns"><button class="btn ghost" onclick="closeModal()">取消</button>'
    +(S.exam.checkins[ds]?'<button class="btn ghost" style="color:var(--red)" onclick="timeLogClear()">清除</button>':'')
    +'<button class="btn pk" onclick="timeLogOk()">打卡 ✓</button></div>';
  $('modal').innerHTML=h; $('mask').classList.add('on');

function timeLogOk(){
  var idx=Math.round($('wheel').scrollTop/36);
  var h=Math.max(0.5,Math.min(16,Math.round((idx+1)*0.5*10)/10));
  var subj=$('time-subj').value; if(!subj){toast('先选择科目哦');return}
  if(!S.exam.subjTime)S.exam.subjTime=[];
  S.exam.subjTime.push({date:wheelDate,subj:subj,mins:Math.round(h*60)});
  S.exam.checkins[wheelDate]=(S.exam.checkins[wheelDate]||0)+h;
  closeModal(); render(); toast('打卡 '+h+' 小时，好样的！🔥');
}
function timeLogClear(){
  S.exam.subjTime=(S.exam.subjTime||[]).filter(function(t){return t.date!==wheelDate});
  delete S.exam.checkins[wheelDate];
  closeModal(); render(); toast('已清除该日打卡');
}

var MBUF={imgs:[],audios:[]}, recRec=null, recTimer=null, dictRec=null;
function resetMBuf(){ MBUF={imgs:[],audios:[]}; }
function mediaBtns(){
  return '<div class="mrow"><button type="button" class="mbtn" onclick="pickImg(1)">📷 拍照</button>'
    +'<button type="button" class="mbtn" onclick="pickImg(0)">🖼 图片</button>'
    +'<button type="button" class="mbtn" id="recbtn" onclick="recToggle()">🎙 录音</button></div><div id="mprev"></div>';
}
function dictBtn(t){ return '<button type="button" class="dict" onclick="startDict(\''+t+'\')">🗣 语音输入</button>'; }
function fldT(label,id,rows,ph,dict,val){
  return '<div class="fld"><label>'+label+(dict?dictBtn(id):'')+'</label><textarea id="'+id+'" rows="'+rows+'" placeholder="'+esc(ph||'')+'">'+esc(val||'')+'</textarea></div>';
}
function subjSelHtml(id,withAll,val){
  var h='<div class="fld"><label>所属科目 / 板块</label><select id="'+id+'">';
  subjOpts(withAll).forEach(function(o){ h+='<option value="'+o.v+'"'+(val===o.v?' selected':'')+'>'+o.t+'</option>'; });
  return h+'</select></div>';
}
function pickImg(cam){
  var f=$('img-in');
  if(cam)f.setAttribute('capture','environment'); else f.removeAttribute('capture');
  f.click();
}
$('img-in').addEventListener('change',function(e){
  var f=e.target.files[0]; e.target.value='';
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width,hh=img.height,max=900;
      if(w>max){hh=Math.round(hh*max/w);w=max}
      var cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      MBUF.imgs.push(cv.toDataURL('image/jpeg',0.55));
      drawMPrev(); toast('图片已添加 🖼');
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
});
function recToggle(){
  var btn=$('recbtn');
  if(recRec){ try{recRec.stop()}catch(e){} return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ toast('当前环境不支持录音 🥲'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var chunks=[], mr=new MediaRecorder(st); recRec=mr;
    var t0=Date.now();
    btn.classList.add('rec'); btn.textContent='⏹ 停止 0:00';
    recTimer=setInterval(function(){
      var s=Math.floor((Date.now()-t0)/1000);
      btn.textContent='⏹ 停止 '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
      if(s>=120){ try{mr.stop()}catch(e){} }
    },500);
    mr.ondataavailable=function(ev){ chunks.push(ev.data); };
    mr.onstop=function(){
      clearInterval(recTimer); recRec=null;
      st.getTracks().forEach(function(tr){tr.stop()});
      if(btn&&btn.isConnected){ btn.classList.remove('rec'); btn.textContent='🎙 录音'; }
      var bl=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      var rd=new FileReader();
      rd.onload=function(){ MBUF.audios.push(rd.result); drawMPrev(); toast('语音条已添加 🎙'); };
      rd.readAsDataURL(bl);
    };
    mr.start();
  }).catch(function(){ toast('无法访问麦克风，请检查权限'); });
}
function stopMedia(){
  try{ if(recRec)recRec.stop(); }catch(e){}
  try{ if(dictRec)dictRec.stop(); }catch(e){}
  dictRec=null;
}
function startDict(target){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('此浏览器不支持语音转文字，可用录音条代替 🎙'); return; }
  if(dictRec){ try{dictRec.stop()}catch(e){} dictRec=null; return; }
  var r=new SR(); dictRec=r;
  r.lang='zh-CN'; r.interimResults=false; r.continuous=true;
  toast('正在聆听…再点一次结束 🗣');
  r.onresult=function(e){
    var s='';
    for(var i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal)s+=e.results[i][0].transcript; }
    var el=$(target); if(el&&s){ el.value=(el.value?el.value:'')+s; }
  };
  r.onerror=function(){ toast('识别没成功，再试一次或改用录音'); dictRec=null; };
  r.onend=function(){ dictRec=null; };
  r.start();
}
function drawMPrev(){
  var el=$('mprev'); if(!el)return;
  var h='';
  MBUF.imgs.forEach(function(im,i){ h+='<span class="mth"><img class="mi-th" src="'+im+'" onclick="imgView(this.src)"><button class="del" onclick="MBUF.imgs.splice('+i+',1);drawMPrev()">✕</button></span>'; });
  MBUF.audios.forEach(function(a,i){ h+='<span class="mth" style="width:100%"><audio controls src="'+a+'"></audio><button class="del" onclick="MBUF.audios.splice('+i+',1);drawMPrev()">✕</button></span>'; });
  el.innerHTML=h;
}

function savePaper(isXc){
  isXc=isXc==='true';
  var name=$('pp-name').value.trim();
  var score=$('pp-score').value.trim();
  if(!name||!score){toast('名称和总分要填哦');return false}
  var secs=[],R=0,A=0;
  (isXc?XC_SEC:SL_SEC).forEach(function(n,i){
    var p=($('pp-s'+i).value||'').split('/');
    if(isXc){ var r2=p[0]*1||0,a2=p[1]*1||0; R+=r2;A+=a2; secs.push({name:n,right:r2,all:a2}); }
    else secs.push({name:n,got:p[0]*1||0,full:p[1]*1||0});
  });
  S.exam.papers.push({id:uid(),type:isXc?'xc':'sl',name:name,date:$('pp-date').value||today(),score:score*1,minutes:$('pp-min').value*1||0,secs:secs,notes:$('pp-notes').value.trim(),acc:(isXc&&A>0)?Math.round(R/A*100):null});
  closeModal(); render(); toast('试卷已归档，看看趋势 📈');
}
function rmPaper(id){ confirmBox('删除这套试卷记录吗？',function(){ S.exam.papers=S.exam.papers.filter(function(p){return p.id!==id}); render(); }); }

function dailyPick(arr,n){
  var seed=Math.floor(Date.now()/86400000)+exAccuShift;
  var out=[],start=((seed*n)%arr.length+arr.length)%arr.length;
  for(var i=0;i<Math.min(n,arr.length);i++)out.push(arr[(start+i)%arr.length]);
  return out;
}

function toggleNormAns(btn){
  var ans=btn.parentNode.querySelector('.norm-ans');
  if(ans.classList.contains('show')){ ans.classList.remove('show'); btn.textContent='👀 看答案'; }
  else{ ans.classList.add('show'); btn.textContent='🙈 隐藏答案'; }
}
function toggleRecBody(btn){
  var rid=btn.getAttribute('data-rid');
  var body=btn.parentNode.querySelector('[data-rbody="'+rid+'"]');
  if(body.classList.contains('show')){
    body.classList.remove('show');
    btn.textContent='👀 看内容';
    exRecOpen='';
  }else{
    body.classList.add('show');
    btn.textContent='🙈 收起内容';
    exRecOpen=rid;
  }
}

      h+='</svg>';
    }
    var last=ws.length?ws[ws.length-1]:null;
    if(last&&S.fit.goal.weight){
      var diff=(last.kg-S.fit.goal.weight).toFixed(1);
      h+='<p style="font-size:12px;color:var(--ink-2);text-align:center;margin-top:4px">当前 '+last.kg+'kg · 距目标 '+S.fit.goal.weight+'kg 还差 <b style="color:#e0699e">'+Math.abs(diff)+'kg</b>'+(diff<=0?'，已经达标啦 🎉':'，加油！')+'</p>';
    }
    if(!ws.length) h+=emptyHtml('🐰','记录第一条体重数据吧');
    h+='</div>';
    if(ws.length){
      h+='<div class="card"><h3>📋 历史记录</h3><div class="dotline"></div>'+ws.slice().reverse().slice(0,15).map(function(w,i,arr2){
        return '<div class="li"><span>'+fmtD(w.date)+'</span><b>'+w.kg+' kg</b></div>';
      }).join('')+'</div>';
    }
  }
  if(tb===2){
    var wmin2=0; S.fit.workouts.forEach(function(w){ if(wk.indexOf(w.date)>=0)wmin2+=w.minutes*1; });
    var pct=Math.min(100,Math.round(wmin2/S.fit.goal.weekly*100));
    h+='<div class="card"><div class="rowline"><h3>🎯 我的小目标</h3><button class="btn sm ghost" onclick="setFitGoal()">✏️ 修改</button></div><div class="dotline"></div>'
      +'<div class="li"><span>目标体重</span><b>'+(S.fit.goal.weight?S.fit.goal.weight+' kg':'未设置')+'</b></div>'
      +'<div class="li"><span>每周运动</span><b>'+S.fit.goal.weekly+' 分钟</b></div>'
      +'<p style="font-size:12px;color:var(--ink-2);margin:10px 0 6px">本周完成 '+wmin2+' / '+S.fit.goal.weekly+' 分钟（'+pct+'%）</p>'
      +'<div class="bar pink"><i style="width:'+pct+'%"></i></div></div>';
  }
  return h;
}
function addWorkout(){
  showModal('运动打卡 🏃',[
    {key:'type',label:'运动类型',type:'select',options:['跑步','散步','跳操','瑜伽','力量训练','骑行','游泳','羽毛球','其他']},
    {key:'minutes',label:'时长（分钟）',type:'number',ph:'30'},
    {key:'kcal',label:'消耗（kcal，可不填）',type:'number',ph:'200'},
    {key:'date',label:'日期',type:'date',value:today()}
  ],function(v){
    if(!v.minutes)return false;
    S.fit.workouts.push({id:uid(),type:v.type,minutes:v.minutes*1,kcal:v.kcal*1||0,date:v.date||today()}); render(); toast('汗水不会骗人 💦');
  });
}
function addWeight(){
  showModal('记录体重 ⚖️',[
    {key:'kg',label:'体重（kg）',type:'number',step:'0.1',ph:'50.5'},
    {key:'date',label:'日期',type:'date',value:today()}
  ],function(v){
    if(!v.kg)return false;
    S.fit.weights=S.fit.weights.filter(function(w){return w.date!==(v.date||today())});
    S.fit.weights.push({date:v.date||today(),kg:v.kg*1});
    S.fit.weights.sort(function(a,b){return a.date<b.date?-1:1});
    render(); toast('已记录 ✔');
  });
}
function setFitGoal(){
  showModal('设置目标 🎯',[
    {key:'weight',label:'目标体重（kg）',type:'number',step:'0.1',value:S.fit.goal.weight},
    {key:'weekly',label:'每周运动目标（分钟）',type:'number',value:S.fit.goal.weekly}
  ],function(v){ S.fit.goal.weight=v.weight; S.fit.goal.weekly=v.weekly*1||150; render(); });
}

/* ================= 4. 饮食 ================= */
function rDiet(){
  var h='<div class="head"><div class="pgo" onclick="openNav()">🥗</div><div class="ht"><h1>好好吃饭</h1><div class="sub">认真吃饭也是一种自律</div></div><button class="gear" onclick="openSettings()">⚙️</button></div>';
  h+=tabsHtml('diet',['🍱 三餐记录','💧 喝水打卡','📊 统计']);
  var tb=tabState.diet, t=today();
  if(tb===0){
    var meals=S.diet.meals.filter(function(m){return m.date===t});
    var kcal=0; meals.forEach(function(m){kcal+=m.kcal*1||0});
    h+='<div class="count" style="background:linear-gradient(135deg,#eefbe0,#d7f3ef)"><div class="cn">今日摄入</div><b style="color:var(--teal-d)">'+kcal+'</b> kcal<i>细嚼慢咽，好好吃饭 🍚</i></div>';
    ['早餐 🌅','午餐 ☀️','晚餐 🌙','加餐 🍪'].forEach(function(label){
      var key=label.split(' ')[0];
      var ms=meals.filter(function(m){return m.meal===key});
      h+='<div class="card"><div class="rowline"><h3>'+label+'</h3><button class="btn sm" onclick="addMeal(\''+key+'\')">＋</button></div>';
      if(ms.length){ h+='<div class="dotline"></div>'+ms.map(function(m){
        return '<div class="li"><span>'+esc(m.food)+'</span><span><span class="pill yl">'+(m.kcal||0)+' kcal</span> <button class="del" onclick="rmMeal(\''+m.id+'\')">✕</button></span></div>';
      }).join(''); }
      h+='</div>';
    });
  }
  if(tb===1){
    var cups=S.diet.water[t]||0, goal=S.diet.waterGoal;
    h+='<div class="card"><h3>💧 今日喝水 '+cups+' / '+goal+' 杯 '+(cups>=goal?'🎉':'')+'</h3><div class="dotline"></div><div class="cups">';
    for(var i=0;i<goal;i++){
      h+='<div class="cup'+(i<cups?' full':'')+'" onclick="setWater('+(i+1)+')">'+(i<cups?'💧':'🥛')+'</div>';
    }
    h+='</div><p style="text-align:center;font-size:11px;color:var(--ink-2);margin-top:8px">点击杯子记录，点最后一杯可取消</p>'
      +'<div style="text-align:center;margin-top:8px"><button class="btn sm ghost" onclick="setWaterGoal()">🎯 修改目标（'+goal+' 杯）</button></div></div>';
  }
  if(tb===2){
    var wk=weekDates();
    var maxK=1, arrK=wk.map(function(d){var k=0;S.diet.meals.forEach(function(m){if(m.date===d)k+=m.kcal*1||0});maxK=Math.max(maxK,k);return k});
    h+='<div class="card"><h3>🍱 近 7 天摄入 (kcal)</h3><div class="dotline"></div><div class="bars7">';
    wk.forEach(function(d,i){ h+='<div class="b7"><em>'+(arrK[i]||'')+'</em><i style="height:'+(arrK[i]/maxK*70)+'px"></i><span>'+d.slice(8)*1+'日</span></div>'; });
    h+='</div></div>';
    var maxW=S.diet.waterGoal, arrW=wk.map(function(d){return S.diet.water[d]||0});
    h+='<div class="card"><h3>💧 近 7 天喝水 (杯)</h3><div class="dotline"></div><div class="bars7">';
    wk.forEach(function(d,i){ h+='<div class="b7 teal"><em>'+(arrW[i]||'')+'</em><i style="height:'+(Math.min(1,arrW[i]/maxW)*70)+'px"></i><span>'+d.slice(8)*1+'日</span></div>'; });
    h+='</div></div>';
  }
  return h;
}
function addMeal(meal){
  showModal('记录饮食 🍱',[
    {key:'meal',label:'哪一餐',type:'select',options:['早餐','午餐','晚餐','加餐'],value:meal||'早餐'},
    {key:'food',label:'吃了什么',ph:'例如：燕麦酸奶碗'},
    {key:'kcal',label:'热量（kcal，可估算）',type:'number',ph:'300'}
  ],function(v){
    if(!v.food)return false;
    S.diet.meals.push({id:uid(),date:today(),meal:v.meal,food:v.food,kcal:v.kcal*1||0}); render(); toast('干饭记录 ✔');
  });
}
function rmMeal(id){ S.diet.meals=S.diet.meals.filter(function(m){return m.id!==id}); render(); }
function setWater(n){
  var t=today(), c=S.diet.water[t]||0;
  S.diet.water[t]= (n===c)? n-1 : n;
  render();
  if(S.diet.water[t]>=S.diet.waterGoal) toast('喝水达标啦 💧🎉');
}
function setWaterGoal(){
  showModal('每日喝水目标 💧',[{key:'g',label:'每天喝几杯',type:'number',value:S.diet.waterGoal}],function(v){
    if(v.g*1>0){S.diet.waterGoal=Math.min(16,v.g*1);render();}
  });
}

/* ================= 5. 爱好 ================= */
function rHobby(){
  var h='<div class="head"><div class="pgo" onclick="openNav()">🎨</div><div class="ht"><h1>爱好小屋</h1><div class="sub">热爱可抵岁月漫长</div></div><button class="gear" onclick="openSettings()">⚙️</button></div>';
  h+=tabsHtml('hobby',['🧸 爱好清单','📷 时光记录','✨ 心愿单']);
  var tb=tabState.hobby;
  if(tb===0){
    h+='<div class="card"><div class="rowline"><h3>🧸 我的爱好</h3><button class="btn sm pk" onclick="addHobby()">＋ 爱好</button></div><div class="dotline"></div>';
    h+= S.hobby.list.length? '<div class="grid2">'+S.hobby.list.map(function(hb,i){
      var n=S.hobby.logs.filter(function(l){return l.hobby===hb.name}).length;
      return '<div class="mcard '+['mc5','mc2','mc1','mc3','mc4','mc6'][i%6]+'" onclick="addHobbyLog(\''+esc(hb.name)+'\')"><span class="mi">'+esc(hb.icon||'🌸')+'</span><b>'+esc(hb.name)+'</b><p>记录 <em>'+n+'</em> 次 · 点击打卡</p></div>';
    }).join('')+'</div>' : emptyHtml('🎠','添加你的小爱好');
    h+='</div>';
  }
  if(tb===1){
    h+='<div class="card"><div class="rowline"><h3>📷 时光记录</h3><button class="btn sm pp" onclick="addHobbyLog()">＋ 记录</button></div><div class="dotline"></div>';
    h+= S.hobby.logs.length? S.hobby.logs.map(function(l){
      return '<div class="li"><div style="flex:1">'+esc(l.note)+'<small>'+fmtD(l.date)+(l.hobby?' · '+esc(l.hobby):'')+'</small></div>'
        +(l.hobby?'<span class="pill pk">'+esc(l.hobby)+'</span>':'')
        +'<button class="del" onclick="rmHobbyLog(\''+l.id+'\')">✕</button></div>';
    }).join('') : emptyHtml('🫧','记录美好瞬间');
    h+='</div>';
  }
  if(tb===2){
    h+='<div class="card"><div class="rowline"><h3>✨ 心愿单</h3><button class="btn sm pk" onclick="addWish()">＋ 心愿</button></div><div class="dotline"></div>';
    h+= S.hobby.wishes.length? S.hobby.wishes.map(function(w){
      return '<div class="li wish'+(w.done?' done':'')+'"><div class="wish-ck" onclick="tgWish(\''+w.id+'\')">'+(w.done?'✓':'')+'</div><div class="w-t" style="flex:1">'+esc(w.title)+'</div><button class="del" onclick="rmWish(\''+w.id+'\')">✕</button></div>';
    }).join('') : emptyHtml('🌠','写下想实现的小心愿吧');
    h+='</div>';
  }
  return h;
}
function addHobby(){
  showModal('添加爱好 🧸',[
    {key:'name',label:'爱好名称',ph:'例如：手账 / 摄影 / 烘焙'},
    {key:'icon',label:'挑一个 emoji 图标',ph:'📔'}
  ],function(v){ if(!v.name)return false; S.hobby.list.push({name:v.name,icon:v.icon||'🌸'}); render(); });
}
function addHobbyLog(hobby){
  var opts=[{v:'',t:'（不关联爱好）'}].concat(S.hobby.list.map(function(x){return{v:x.name,t:x.icon+' '+x.name}}));
  showModal('时光记录 📷',[
    {key:'hobby',label:'关联爱好',type:'select',options:opts,value:hobby||''},
    {key:'note',label:'记录内容',type:'textarea',ph:'今天做了什么开心的事？'},
    {key:'date',label:'日期',type:'date',value:today()}
  ],function(v){
    if(!v.note)return false;
    S.hobby.logs.unshift({id:uid(),hobby:v.hobby,note:v.note,date:v.date||today()}); render(); toast('美好 +1 🌷');
  });
}
function rmHobbyLog(id){ S.hobby.logs=S.hobby.logs.filter(function(l){return l.id!==id}); render(); }
function addWish(){
  showModal('许个心愿 ✨',[{key:'title',label:'心愿内容',ph:'例如：去海边看日出'}],function(v){
    if(!v.title)return false; S.hobby.wishes.unshift({id:uid(),title:v.title,done:false}); render();
  });
}
function tgWish(id){ S.hobby.wishes.forEach(function(w){if(w.id===id){w.done=!w.done; if(w.done)toast('心愿达成 🎉');}}); render(); }
function rmWish(id){ S.hobby.wishes=S.hobby.wishes.filter(function(w){return w.id!==id}); render(); }

/* ================= 6. 理财 ================= */
var CAT_OUT=['餐饮 🍜','购物 🛍️','交通 🚌','娱乐 🎮','学习 📚','居家 🏠','其他 🌸'];
var CAT_IN=['工资 💼','兼职 ✍️','理财收益 📈','红包 🧧','其他 🎁'];
function rMoney(){
  var h='<div class="head"><div class="pgo" onclick="openNav()">💰</div><div class="ht"><h1>小金库</h1><div class="sub">攒钱是为了底气和自由</div></div><button class="gear" onclick="openSettings()">⚙️</button></div>';
  h+=tabsHtml('money',['🧾 记账','📉 预算','🐷 存钱罐']);
  var tb=tabState.money, ms=monthStr();
  var mIn=0,mOut=0, recs=S.money.records.filter(function(r){return r.date.slice(0,7)===ms});
  recs.forEach(function(r){ if(r.type==='in')mIn+=r.amount*1; else mOut+=r.amount*1; });
  if(tb===0){
    h+='<div class="card"><div class="mini-stats">'
      +'<div class="mini"><b class="amount-in">¥'+mIn.toFixed(0)+'</b><i>本月收入</i></div>'
      +'<div class="mini"><b class="amount-out">¥'+mOut.toFixed(0)+'</b><i>本月支出</i></div>'
      +'<div class="mini"><b style="color:#8a68d8">¥'+(mIn-mOut).toFixed(0)+'</b><i>结余</i></div></div></div>';
    h+='<div class="card"><div class="rowline"><h3>🧾 收支记录</h3><button class="btn sm pk" onclick="addRecord()">＋ 记一笔</button></div><div class="dotline"></div>';
    var list=S.money.records.slice().reverse().slice(0,40);
    h+= list.length? list.map(function(r){
      return '<div class="li"><div>'+esc(r.cat)+(r.note?'<small>'+esc(r.note)+'</small>':'')+'<small>'+fmtD(r.date)+'</small></div>'
        +'<span class="'+(r.type==='in'?'amount-in':'amount-out')+'">'+(r.type==='in'?'+':'−')+'¥'+(r.amount*1).toFixed(2)+'</span>'
        +'<button class="del" onclick="rmRecord(\''+r.id+'\')">✕</button></div>';
    }).join('') : emptyHtml('🪙','记下第一笔账吧');
    h+='</div>';
  }
  if(tb===1){
    var pct=Math.min(100,Math.round(mOut/S.money.budget*100));
    h+='<div class="count" style="background:linear-gradient(135deg,#fff3d6,#fde3ee)" onclick="setBudget()"><div class="cn">本月预算</div>'
      +'<b style="color:#d29a3a;font-size:30px">¥'+mOut.toFixed(0)+'</b> / ¥'+S.money.budget
      +'<i>'+(pct>=100?'超支啦，捂紧钱包！🙈':'已用 '+pct+'%，点击修改预算')+'</i></div>';
    h+='<div class="card"><div class="bar pink" style="margin-bottom:14px"><i style="width:'+pct+'%'+(pct>=90?';background:linear-gradient(90deg,#f08c8c,#f7a8c9)':'')+'"></i></div>';
    // 分类占比
    var cats={};
    recs.forEach(function(r){ if(r.type==='out') cats[r.cat]=(cats[r.cat]||0)+r.amount*1; });
    var keys=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]});
    if(keys.length){
      h+='<h3 style="margin-bottom:10px">🍩 本月支出分类</h3>';
      keys.forEach(function(k){
        var p=Math.round(cats[k]/mOut*100);
        h+='<div class="catbar"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+p+'%"></i></div><b>¥'+cats[k].toFixed(0)+'</b></div>';
      });
    }else h+=emptyHtml('🌿','本月还没有支出记录');
    h+='</div>';
  }
  if(tb===2){
    h+='<div class="card"><div class="rowline"><h3>🐷 存钱目标</h3><button class="btn sm pp" onclick="addSaving()">＋ 目标</button></div><div class="dotline"></div>';
    h+= S.money.savings.length? S.money.savings.map(function(s){
      var p=Math.min(100,Math.round(s.saved/s.target*100));
      return '<div class="subj"><div class="rowline"><span>'+esc(s.name)+' '+(p>=100?'🎉':'')+'</span>'
        +'<span style="font-size:12px"><b style="color:var(--teal-d)">¥'+(s.saved*1).toFixed(0)+'</b> / ¥'+(s.target*1).toFixed(0)
        +' <button class="btn sm" onclick="deposit(\''+s.id+'\')">存入</button> <button class="del" onclick="rmSaving(\''+s.id+'\')">✕</button></span></div>'
        +'<div class="bar"><i style="width:'+p+'%"></i></div></div>';
    }).join('') : emptyHtml('🐖','建一个存钱小目标');
    h+='</div>';
  }
  return h;
}
function addRecord(){
  showModal('记一笔 🧾',[
    {key:'type',label:'类型',type:'select',options:[{v:'out',t:'支出 💸'},{v:'in',t:'收入 💵'}]},
    {key:'cat',label:'分类（支出/收入分类见下）',type:'select',options:CAT_OUT.concat(CAT_IN)},
    {key:'amount',label:'金额（¥）',type:'number',step:'0.01',ph:'0.00'},
    {key:'note',label:'备注（可不填）',ph:'例如：和朋友吃火锅'},
    {key:'date',label:'日期',type:'date',value:today()}
  ],function(v){
    if(!(v.amount*1>0)){toast('金额要大于 0 哦');return false}
    S.money.records.push({id:uid(),type:v.type,cat:v.cat,amount:v.amount*1,note:v.note,date:v.date||today()}); render(); toast('已入账 ✔');
  });
}
function rmRecord(id){ S.money.records=S.money.records.filter(function(r){return r.id!==id}); render(); }
function setBudget(){
  showModal('本月预算 📉',[{key:'b',label:'预算金额（¥）',type:'number',value:S.money.budget}],function(v){
    if(v.b*1>0){S.money.budget=v.b*1;render();}
  });
}
function addSaving(){
  showModal('存钱目标 🐷',[
    {key:'name',label:'目标名称',ph:'例如：旅行基金'},
    {key:'target',label:'目标金额（¥）',type:'number',ph:'3000'}
  ],function(v){
    if(!v.name||!(v.target*1>0))return false;
    S.money.savings.push({id:uid(),name:v.name,target:v.target*1,saved:0}); render();
  });
}
function deposit(id){
  showModal('存入金额 🪙',[{key:'a',label:'这次存多少（¥）',type:'number',step:'0.01'}],function(v){
    if(!(v.a*1>0))return false;
    S.money.savings.forEach(function(s){ if(s.id===id){ s.saved+=v.a*1; if(s.saved>=s.target)toast('目标达成！🎉'); } });
    render();
  });
}
function rmSaving(id){ S.money.savings=S.money.savings.filter(function(s){return s.id!==id}); render(); }

/* ================= 启动 ================= */
_cachePages();
render();
// 启动页淡出
setTimeout(function(){var s=document.getElementById('splash');if(s)s.classList.add('hide');},1400);
</script>
