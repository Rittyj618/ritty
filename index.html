function genSkinAdvice(){ render(); toast('已刷新建议 💡'); }

function genSkinAdviceData(){
  var p=S.skin.profile;
  var prods=S.skin.products;
  var advice=[];
  var hasType=!!p.type, hasAcne=!!p.acne;

  // 1. 流程完整性检查
  var amSteps=S.skin.routines.am||[], pmSteps=S.skin.routines.pm||[];
  var hasCleanser=prods.some(function(x){return x.type==='洁面'&&x.status!=='已用完'});
  var hasSunscreen=prods.some(function(x){return x.type==='防晒'&&x.status!=='已用完'});
  var hasMoist=prods.some(function(x){return (x.type==='乳液'||x.type==='面霜')&&x.status!=='已用完'});

  var flowMsg=[];
  if(!hasCleanser)flowMsg.push('⚠️ 仓库里没有「洁面」产品，建议补充一款温和洁面');
  if(!hasSunscreen)flowMsg.push('⚠️ 缺少「防晒」，防晒是护肤重中之重！');
  if(!hasMoist)flowMsg.push('⚠️ 缺少「乳液/面霜」保湿产品');
  if(amSteps.length<2)flowMsg.push('☀️ 早间流程步骤偏少，建议至少：洁面→保湿→防晒');
  if(pmSteps.length<2)flowMsg.push('🌙 晚间流程步骤偏少，建议至少：卸妆/洁面→保湿');
  if(flowMsg.length){
    advice.push({icon:'📋',title:'流程完整性',bg:'#fff5e6',html:flowMsg.join('\n')});
  }else{
    advice.push({icon:'📋',title:'流程完整性',bg:'#e8f7ee',html:'✅ 基础流程齐全，继续保持！'});
  }

  // 2. 痘痘专项建议
  if(hasAcne && (p.acne==='频繁长痘'||p.acne==='严重痘痘')){
    var acneMsg=[];
    acneMsg.push('你的痘痘情况为「'+p.acne+'」，需要特别注意：');
    acneMsg.push('1. 避免厚重封闭性产品（如矿物油、厚重面霜）');
    acneMsg.push('2. 可选含水杨酸(BHA)、烟酰胺、茶树精油成分的产品');
    acneMsg.push('3. 精简护肤，避免叠加太多层');
    acneMsg.push('4. 注意清洁但不要过度，避免皂基洁面');
    // 检查仓库里是否有祛痘相关
    var hasBHA=prods.some(function(x){return /水杨酸|BHA|祛痘|茶树/i.test(x.name+x.note)});
    if(hasBHA)acneMsg.push('✅ 检测到仓库有祛痘成分产品，可重点使用');
    else acneMsg.push('💡 仓库暂无明确祛痘成分产品，可考虑补充');
    if(p.acne==='严重痘痘')acneMsg.push('⚠️ 严重痘痘建议皮肤科就诊，护肤品只能辅助');
    advice.push({icon:'🌋',title:'痘痘专项',bg:'#ffeef0',html:acneMsg.join('\n')});
  }

  // 3. 敏感肌建议
  if(p.sensitive==='容易泛红'||p.sensitive==='重度敏感'){
    var senMsg=[];
    senMsg.push('你的肌肤「'+p.sensitive+'」，护肤原则：');
    senMsg.push('1. 选成分精简、无香精无酒精的产品');
    senMsg.push('2. 新产品先在耳后/手腕内侧做48小时测试');
    senMsg.push('3. 避免高浓度酸类、酒精、香精');
    if(p.allergy){
      senMsg.push('4. 你的过敏成分：'+p.allergy+'，购买前务必查成分表');
      // 检查仓库里是否有含过敏成分的
      var allergens=p.allergy.split(/[,，、\s]+/).filter(function(x){return x});
      var risky=[];
      prods.forEach(function(x){
        allergens.forEach(function(a){
          if(a && (x.name.indexOf(a)>=0||(x.note||'').indexOf(a)>=0))risky.push(x.name);
        });
      });
      if(risky.length)senMsg.push('⚠️ 仓库中可能含过敏成分：'+risky.join('、')+'，建议停用');
    }
    advice.push({icon:'🌸',title:'敏感肌护理',bg:'#fdeef6',html:senMsg.join('\n')});
  }

  // 4. 肤质匹配建议
  if(hasType){
    var tyMsg=[];
    if(p.type==='油性'||p.type==='混油'){
      tyMsg.push('油性/混油肌肤建议：');
      tyMsg.push('• 选清爽型保湿（啫喱/凝露），避免厚重面霜');
      tyMsg.push('• 定期使用水杨酸/BHA疏通毛孔');
      tyMsg.push('• 控油同时不要忽略保湿，水油平衡才是关键');
    }else if(p.type==='干性'||p.type==='混干'){
      tyMsg.push('干性/混干肌肤建议：');
      tyMsg.push('• 选滋润型保湿，面霜+精华叠加');
      tyMsg.push('• 可用含透明质酸、神经酰胺、角鲨烷的产品');
      tyMsg.push('• 洁面选氨基酸型，避免皂基过度清洁');
    }else if(p.type==='中性'){
      tyMsg.push('中性肌肤很棒！建议：');
      tyMsg.push('• 维持现状，做好基础保湿+防晒即可');
      tyMsg.push('• 可根据季节调整产品厚薄');
    }else if(p.type==='敏感'){
      tyMsg.push('敏感肌肤建议：');
      tyMsg.push('• 精简护肤，less is more');
      tyMsg.push('• 选药妆/敏感肌专用品牌');
      tyMsg.push('• 避免频繁换产品和去角质');
    }
    if(tyMsg.length)advice.push({icon:'🎯',title:'肤质匹配',bg:'#eef0ff',html:tyMsg.join('\n')});
  }

  // 5. 产品搭配建议
  if(prods.length>=2){
    var matchMsg=[];
    var hasEssence=prods.some(function(x){return x.type==='精华'&&x.status!=='已用完'});
    var hasMask=prods.some(function(x){return x.type==='面膜'&&x.status!=='已用完'});
    if(hasEssence)matchMsg.push('✅ 有精华，建议在爽肤水后、乳液前使用');
    if(hasMask)matchMsg.push('🎭 有面膜，建议每周2-3次，敷完记得锁水');
    var using=prods.filter(function(x){return x.status==='在使用'});
    if(using.length>8)matchMsg.push('⚠️ 同时在用的产品较多('+using.length+'件)，精简一些更利于肌肤稳定');
    if(matchMsg.length)advice.push({icon:'🧴',title:'产品搭配',bg:'#f0f7ee',html:matchMsg.join('\n')});
  }

  // 6. 每日打卡提醒
  var t=today();
  var todayLog=S.skin.logs.filter(function(l){return l.date===t});
  if(!todayLog.length){
    advice.push({icon:'⏰',title:'今日提醒',bg:'#fff5e6',html:'今天还没护肤打卡哦～记得早晚护肤！\n坚持是最好的护肤'});
  }else{
    var todayBreakout=todayLog.some(function(l){return l.breakout&&l.breakout.indexOf('无')<0});
    if(todayBreakout){
      advice.push({icon:'⚠️',title:'今日关注',bg:'#ffeef0',html:'今天有冒痘记录，注意：\n• 暂停新产品尝试\n• 避免辛辣甜食\n• 保证睡眠，多喝水'});
    }else{
      advice.push({icon:'🌟',title:'今日状态',bg:'#e8f7ee',html:'今天已护肤打卡，且无新痘，继续保持！\n好皮肤是坚持出来的～'});
    }
  }

  if(!advice.length){
    advice.push({icon:'💡',title:'开始使用',bg:'#f6f4ff',html:'完善肤质档案 + 添加护肤品后\n就能获得个性化护肤建议啦！'});
  }
  return advice;
}

/* ================= 6. 理财 ================= */
var CAT_OUT=['餐饮 🍜','购物 🛍️','交通 🚌','娱乐 🎮','学习 📚','居家 🏠','其他 🌸'];
var CAT_IN=['工资 💼','兼职 ✍️','理财收益 📈','红包 🧧','其他 🎁'];
function rMoney(){
  var h='<div class="head"><div class="pgo" onclick="openNav()">💰</div><div class="ht"><h1>小金库</h1><div class="sub">攒钱是为了底气和自由</div></div><button class="gear" onclick="openSettings()">⚙️</button></div>';
  h+=tabsHtml('money',['🧾 记账','📉 预算','🐷 存钱罐']);
  var tb=tabState.money, ms=monthStr();
  var mIn=0,mOut=0, recs=S.money.records.filter(function(r){return r.date.slice(0,7)===ms});
  recs.forEach(function(r){ if(r.type==='in')mIn+=r.amount*1; else mOut+=r.amount*1; });
  if(tb===0){
    h+='<div class="card"><div class="mini-stats">'
      +'<div class="mini"><b class="amount-in">¥'+mIn.toFixed(0)+'</b><i>本月收入</i></div>'
      +'<div class="mini"><b class="amount-out">¥'+mOut.toFixed(0)+'</b><i>本月支出</i></div>'
      +'<div class="mini"><b style="color:#8a68d8">¥'+(mIn-mOut).toFixed(0)+'</b><i>结余</i></div></div></div>';
    h+='<div class="card"><div class="rowline"><h3>🧾 收支记录</h3><button class="btn sm pk" onclick="addRecord()">＋ 记一笔</button></div><div class="dotline"></div>';
    var list=S.money.records.slice().reverse().slice(0,40);
    h+= list.length? list.map(function(r){
      return '<div class="li"><div>'+esc(r.cat)+(r.note?'<small>'+esc(r.note)+'</small>':'')+'<small>'+fmtD(r.date)+'</small></div>'
        +'<span class="'+(r.type==='in'?'amount-in':'amount-out')+'">'+(r.type==='in'?'+':'−')+'¥'+(r.amount*1).toFixed(2)+'</span>'
        +'<button class="del" onclick="rmRecord(\''+r.id+'\')">✕</button></div>';
    }).join('') : emptyHtml('🪙','记下第一笔账吧');
    h+='</div>';
  }
  if(tb===1){
    var pct=Math.min(100,Math.round(mOut/S.money.budget*100));
    h+='<div class="count" style="background:linear-gradient(135deg,#fff3d6,#fde3ee)" onclick="setBudget()"><div class="cn">本月预算</div>'
      +'<b style="color:#d29a3a;font-size:30px">¥'+mOut.toFixed(0)+'</b> / ¥'+S.money.budget
      +'<i>'+(pct>=100?'超支啦，捂紧钱包！🙈':'已用 '+pct+'%，点击修改预算')+'</i></div>';
    h+='<div class="card"><div class="bar pink" style="margin-bottom:14px"><i style="width:'+pct+'%'+(pct>=90?';background:linear-gradient(90deg,#f08c8c,#f7a8c9)':'')+'"></i></div>';
    // 分类占比
    var cats={};
    recs.forEach(function(r){ if(r.type==='out') cats[r.cat]=(cats[r.cat]||0)+r.amount*1; });
    var keys=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]});
    if(keys.length){
      h+='<h3 style="margin-bottom:10px">🍩 本月支出分类</h3>';
      keys.forEach(function(k){
        var p=Math.round(cats[k]/mOut*100);
        h+='<div class="catbar"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+p+'%"></i></div><b>¥'+cats[k].toFixed(0)+'</b></div>';
      });
    }else h+=emptyHtml('🌿','本月还没有支出记录');
    h+='</div>';
  }
  if(tb===2){
    h+='<div class="card"><div class="rowline"><h3>🐷 存钱目标</h3><button class="btn sm pp" onclick="addSaving()">＋ 目标</button></div><div class="dotline"></div>';
    h+= S.money.savings.length? S.money.savings.map(function(s){
      var p=Math.min(100,Math.round(s.saved/s.target*100));
      return '<div class="subj"><div class="rowline"><span>'+esc(s.name)+' '+(p>=100?'🎉':'')+'</span>'
        +'<span style="font-size:12px"><b style="color:var(--teal-d)">¥'+(s.saved*1).toFixed(0)+'</b> / ¥'+(s.target*1).toFixed(0)
        +' <button class="btn sm" onclick="deposit(\''+s.id+'\')">存入</button> <button class="del" onclick="rmSaving(\''+s.id+'\')">✕</button></span></div>'
        +'<div class="bar"><i style="width:'+p+'%"></i></div></div>';
    }).join('') : emptyHtml('🐖','建一个存钱小目标');
    h+='</div>';
  }
  return h;
}
function addRecord(){
  showModal('记一笔 🧾',[
    {key:'type',label:'类型',type:'select',options:[{v:'out',t:'支出 💸'},{v:'in',t:'收入 💵'}]},
    {key:'cat',label:'分类（支出/收入分类见下）',type:'select',options:CAT_OUT.concat(CAT_IN)},
    {key:'amount',label:'金额（¥）',type:'number',step:'0.01',ph:'0.00'},
    {key:'note',label:'备注（可不填）',ph:'例如：和朋友吃火锅'},
    {key:'date',label:'日期',type:'date',value:today()}
  ],function(v){
    if(!(v.amount*1>0)){toast('金额要大于 0 哦');return false}
    S.money.records.push({id:uid(),type:v.type,cat:v.cat,amount:v.amount*1,note:v.note,date:v.date||today()}); render(); toast('已入账 ✔');
  });
}
function rmRecord(id){ S.money.records=S.money.records.filter(function(r){return r.id!==id}); render(); }
function setBudget(){
  showModal('本月预算 📉',[{key:'b',label:'预算金额（¥）',type:'number',value:S.money.budget}],function(v){
    if(v.b*1>0){S.money.budget=v.b*1;render();}
  });
}
function addSaving(){
  showModal('存钱目标 🐷',[
    {key:'name',label:'目标名称',ph:'例如：旅行基金'},
    {key:'target',label:'目标金额（¥）',type:'number',ph:'3000'}
  ],function(v){
    if(!v.name||!(v.target*1>0))return false;
    S.money.savings.push({id:uid(),name:v.name,target:v.target*1,saved:0}); render();
  });
}
function deposit(id){
  showModal('存入金额 🪙',[{key:'a',label:'这次存多少（¥）',type:'number',step:'0.01'}],function(v){
    if(!(v.a*1>0))return false;
    S.money.savings.forEach(function(s){ if(s.id===id){ s.saved+=v.a*1; if(s.saved>=s.target)toast('目标达成！🎉'); } });
    render();
  });
}
function rmSaving(id){ S.money.savings=S.money.savings.filter(function(s){return s.id!==id}); render(); }

/* ================= 启动 ================= */
_cachePages();
render();

<script>
// SW 注册：updateViaCache='none' 绕过 HTTP 缓存，新 SW 激活后自动 reload 一次
(function(){

  window.addEventListener('load', function(){

        nw.addEventListener('statechange', function(){
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            nw.postMessage('SKIP_WAITING');
            sessionStorage.setItem(reloadedKey,'1');
            toast('✨ 有新版本，正在刷新…');
          }
        });
      });
    }).catch(function(){});
    // 新 SW 接管后自动 reload 一次（只一次，防死循环）
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(sessionStorage.getItem(reloadedKey)==='1'){
        sessionStorage.removeItem(reloadedKey);
        location.reload();
      }
    });
  });
})();
</script>
</body>
</html>
