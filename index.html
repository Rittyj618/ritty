<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ritty">
<meta name="theme-color" content="#ff9bb3">
<meta name="app-version" content="v13">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ritty 的工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<style>
:root{
  --teal:#5ec9bf; --teal-l:#d7f3ef; --teal-d:#3aa79c;
  --pink:#f7a8c9; --pink-l:#fde3ee; --purple:#b79ced; --purple-l:#ece3fb;
  --cream:#fdf9f3; --ink:#4d4a5c; --ink-2:#8b88a0; --line:#f0e8de;
  --red:#f08c8c; --yellow:#ffd98a; --card:#ffffff;
  --r:18px; --shadow:0 4px 14px rgba(150,130,180,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); background:var(--cream);
  background-image:
    radial-gradient(rgba(247,168,201,.28) 8%, transparent 9%),
    radial-gradient(rgba(94,201,191,.20) 8%, transparent 9%);
  background-size:46px 46px,46px 46px;
  background-position:0 0,23px 23px;
  overscroll-behavior:none;
}
/* ---------- 左侧导航（日常隐藏抽屉） ---------- */
#nav{
  position:fixed;left:0;top:0;bottom:0;width:76px;z-index:90;
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-right:2px dashed var(--line);border-radius:0 22px 22px 0;
  display:flex;flex-direction:column;align-items:center;
  padding:max(12px, env(safe-area-inset-top)) 0 max(12px, env(safe-area-inset-bottom));gap:2px;overflow-y:auto;
  transform:translateX(-105%);
  transition:transform .32s cubic-bezier(.22,1.1,.36,1);
  box-shadow:6px 0 24px rgba(150,130,180,.12);
}
#nav.open{transform:translateX(0)}
#navmask{
  position:fixed;inset:0;z-index:80;background:rgba(80,70,110,.18);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
#navmask.on{opacity:1;pointer-events:auto}
.logo{
  width:50px;height:50px;border-radius:17px;margin-bottom:2px;flex:none;
  background:linear-gradient(135deg,var(--teal-l),var(--pink-l));
  display:flex;align-items:center;justify-content:center;font-size:26px;
  border:2px solid #fff;box-shadow:var(--shadow);cursor:pointer;transition:.2s;
}
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px;cursor:pointer}
.logo-wrap span{font-size:10px;color:var(--ink-2);letter-spacing:1px}
.logo-wrap.on .logo{transform:scale(1.06);background:linear-gradient(135deg,#fff3c9,#ffe1ef)}
.logo-wrap.on span{color:var(--ink);font-weight:700}
.nav-btn{
  width:56px;padding:7px 0 6px;border:none;background:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px;
  color:var(--ink-2);flex:none;position:relative;overflow:hidden;
  transition:transform .18s cubic-bezier(.22,1,.36,1),background .18s;
  animation:navIn .35s cubic-bezier(.22,1,.36,1) both;
}
.nav-btn:nth-child(2){animation-delay:.03s}
.nav-btn:nth-child(3){animation-delay:.06s}
.nav-btn:nth-child(4){animation-delay:.09s}
.nav-btn:nth-child(5){animation-delay:.12s}
.nav-btn:nth-child(6){animation-delay:.15s}
.nav-btn:nth-child(7){animation-delay:.18s}
@keyframes navIn{from{opacity:0;transform:translateX(-16px) scale(.9)}to{opacity:1;transform:none}}
.nav-btn:hover{transform:translateY(-2px)}
.nav-btn:active{transform:scale(.92)}
.nav-btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,rgba(255,255,255,.55) 0%,transparent 70%);transform:scale(0);transition:transform .35s}
.nav-btn:active::after{transform:scale(2.2);opacity:0;transition:transform .35s,opacity .35s}
.nav-ic{
  width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:#f6f2fa;transition:.22s cubic-bezier(.22,1,.36,1);border:2px solid transparent;
}
.nav-btn:hover .nav-ic{transform:translateY(-2px) scale(1.06);box-shadow:0 4px 10px rgba(150,130,180,.14)}
.nav-btn span{font-size:10px;letter-spacing:1px;transition:.15s}
.nav-btn.on{color:var(--ink)}
.nav-btn.on span{font-weight:700}
.nav-btn.on .nav-ic{transform:scale(1.08);border-color:#fff;box-shadow:var(--shadow)}
.nav-btn[data-p="exam"].on .nav-ic{background:linear-gradient(135deg,#d7f3ef,#bfe9ff)}
.nav-btn[data-p="eng"].on .nav-ic{background:linear-gradient(135deg,#ece3fb,#dcd2ff)}
.nav-btn[data-p="fit"].on .nav-ic{background:linear-gradient(135deg,#ffe3ec,#ffd6e5)}
.nav-btn[data-p="diet"].on .nav-ic{background:linear-gradient(135deg,#e5f8d8,#d2f2e6)}
.nav-btn[data-p="skin"].on .nav-ic{background:linear-gradient(135deg,#fde3ee,#ece3fb)}
.nav-btn[data-p="money"].on .nav-ic{background:linear-gradient(135deg,#fff0cd,#ffe4c9)}
/* ---------- 主区域 ---------- */
#main{margin:0 auto;padding:max(16px, env(safe-area-inset-top)) 14px 90px;max-width:560px}
.page{display:none;animation:fadein .25s}
.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
.sub{color:var(--ink-2);font-size:12px;margin-top:3px}
.head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.head .ht{flex:1}
/* 页面左上角头像按钮：点击弹出导航 */
.pgo{
  width:48px;height:48px;flex:none;border-radius:16px;cursor:pointer;
  background:linear-gradient(135deg,var(--teal-l),var(--pink-l));
  border:2px solid #fff;box-shadow:var(--shadow);font-size:24px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .18s;position:relative;
}
.pgo:active{transform:scale(.92)}
.pgo::after{
  content:"≡";position:absolute;right:-4px;bottom:-4px;width:17px;height:17px;
  border-radius:50%;background:var(--pink);color:#fff;font-size:11px;line-height:16px;
  text-align:center;border:1.5px solid #fff;
}
/* 卡片 */
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px;border:1.5px solid #fff}
.card h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dotline{height:6px;border-radius:3px;margin:6px 0 14px;
  background-image:radial-gradient(var(--pink) 34%,transparent 36%);background-size:12px 6px;opacity:.5}
/* 顶部三统计 */
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.stat{border-radius:16px;padding:12px 6px;text-align:center;border:1.5px solid #fff;box-shadow:var(--shadow)}
.stat b{font-size:22px;display:block}
.stat i{font-style:normal;font-size:11px;color:var(--ink-2)}
.st-todo{background:linear-gradient(150deg,#e8fbf7,#d7f3ef)}
.st-done{background:linear-gradient(150deg,#f4edff,#ece3fb)}
.st-over{background:linear-gradient(150deg,#fff0f0,#ffe2e2)}
.st-todo b{color:var(--teal-d)}.st-done b{color:#8a68d8}.st-over b{color:var(--red)}
/* 试卷录入紧凑布局 */
.paper-top{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-bottom:4px}
.paper-top .fld{margin-bottom:0}
.paper-top .fld.wide{grid-column:1 / -1}
.paper-top .fld input,.paper-top .fld select{padding:6px 9px;font-size:12px;border-radius:9px}
.paper-sec{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:4px 0 6px}
.paper-sec .fld{margin-bottom:0}
.paper-sec .fld label{font-size:10px;margin-bottom:2px}
.paper-sec .fld input{padding:6px 9px;font-size:12px;border-radius:9px}
.paper-notes{margin-top:2px}
.paper-notes .fld textarea{padding:6px 9px;font-size:12px;border-radius:9px;min-height:44px;line-height:1.4}
.paper-sec-title{font-size:11.5px;color:var(--ink-2);font-weight:700;margin:6px 0 3px;display:flex;align-items:center;gap:4px}
.paper-sec-title::before,.paper-sec-title::after{content:'';flex:1;height:1.5px;background:repeating-linear-gradient(90deg,#efe4fa 0 4px,transparent 4px 7px)}
/* 任务 */
.task{display:flex;align-items:center;gap:5px;padding:6px 2px;border-bottom:1.5px dashed var(--line);flex-wrap:nowrap}
.task:last-child{border-bottom:none}
.ck{width:16px;height:16px;flex:none;border-radius:5px;border:2px solid var(--teal);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;cursor:pointer}
.task.done .ck{background:var(--teal);border-color:var(--teal)}
.t-main{flex:1;min-width:0;display:flex;align-items:center;gap:3px}
.task.done .t-title{text-decoration:line-through;color:var(--ink-2)}
.t-title{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-tags{display:flex;gap:2px;flex:none;overflow:hidden}
.t-tag{font-size:12px;padding:0;border-radius:0;background:transparent;line-height:1;white-space:nowrap;display:inline-flex;align-items:center;vertical-align:middle}
.t-date{font-size:9.5px;color:var(--ink-2);flex:none;white-space:nowrap}
.t-date.over{color:var(--red);font-weight:700}
.del{border:none;background:none;color:#d9d2e8;font-size:13px;cursor:pointer;padding:1px;flex:none}
/* 模块卡片网格 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mcard{border-radius:var(--r);padding:13px;border:1.5px solid #fff;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.mcard .mi{font-size:22px}
.mcard b{display:block;font-size:14px;margin:5px 0 2px}
.mcard p{font-size:11px;color:var(--ink-2);line-height:1.5}
.mcard em{font-style:normal;font-weight:700;color:var(--ink)}
.mcard::after{content:"";position:absolute;right:-14px;top:-14px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.55)}
.mc1{background:linear-gradient(140deg,#e4f7ff,#d7f3ef)} .mc2{background:linear-gradient(140deg,#f0e8ff,#ece3fb)}
.mc3{background:linear-gradient(140deg,#ffe9f1,#ffdfe9)} .mc4{background:linear-gradient(140deg,#eefbe0,#dcf5ea)}
.mc5{background:linear-gradient(140deg,#fde3ee,#f3e8fd)} .mc6{background:linear-gradient(140deg,#fff3d6,#ffe8cf)}
/* 子导航 tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;cursor:pointer;padding:7px 13px;border-radius:99px;font-size:12.5px;
  background:#fff;color:var(--ink-2);box-shadow:var(--shadow);display:flex;align-items:center;gap:5px;border:1.5px solid transparent}
.tab.on{background:linear-gradient(120deg,var(--teal-l),var(--purple-l));color:var(--ink);font-weight:700;border-color:#fff}
/* 分段切换（计时器模式等） */
.seg{display:flex;gap:3px;background:var(--bg);padding:3px;border-radius:11px;margin-bottom:6px}
.seg button{flex:1;border:none;cursor:pointer;padding:6px 8px;border-radius:8px;font-size:12px;font-weight:600;
  background:transparent;color:var(--ink-2);transition:all .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(150,130,180,.18)}
/* ---- 可爱计时器样式 ---- */
.tmr-seg{display:flex;gap:4px;background:linear-gradient(135deg,#fff5f8,#f0f7ff);padding:4px;border-radius:14px;margin-bottom:8px;border:2px dashed #f0d8e8}
.tmr-seg-btn{flex:1;border:none;cursor:pointer;padding:8px 10px;border-radius:11px;font-size:13px;font-weight:700;background:transparent;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:4px;transition:all .25s}
.tmr-seg-btn.on{background:#fff;color:#c9467c;box-shadow:0 2px 8px rgba(255,122,162,.2);transform:scale(1.02)}
.tmr-seg-emoji{font-size:16px}
.tmr-display{position:relative;width:240px;height:260px;margin:4px auto;display:flex;align-items:center;justify-content:center}
.tmr-tomato{position:relative;z-index:2;width:180px;height:180px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 35% 30%,#ff8fa8 0%,#ff5c8d 40%,#e84272 100%);box-shadow:0 8px 24px rgba(255,92,141,.35),inset 0 -8px 16px rgba(0,0,0,.15),inset 0 4px 12px rgba(255,255,255,.25);border:3px solid #fff;overflow:hidden}
.tmr-tomato::before{content:'';position:absolute;top:6px;left:25%;width:40%;height:20px;background:radial-gradient(ellipse,rgba(255,255,255,.45),transparent 70%);border-radius:50%;pointer-events:none}
.tmr-tomato-emoji{font-size:28px;line-height:1;margin-bottom:2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.tmr-tomato-time{background:rgba(255,255,255,.92);border-radius:14px;padding:4px 14px;margin:2px 0;box-shadow:0 3px 8px rgba(0,0,0,.12);backdrop-filter:blur(4px)}
.tmr-time{font-size:32px;font-weight:800;color:#d13e6e;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1;text-shadow:0 1px 2px rgba(255,255,255,.5)}
.tmr-phase{font-size:11px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3);margin-top:2px}
.tmr-bounce{animation:tmrBounce .7s ease-in-out infinite}
.tmr-idle{animation:none}
@keyframes tmrBounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.tmr-sparkle{position:absolute;font-size:14px;pointer-events:none;z-index:1}
.tmr-sp1{top:10px;left:20px;animation:tmrTwinkle 1.5s ease-in-out infinite}
.tmr-sp2{top:30px;right:15px;animation:tmrTwinkle 1.5s ease-in-out infinite .5s}
.tmr-sp3{bottom:20px;left:15px;animation:tmrTwinkle 1.5s ease-in-out infinite 1s}
@keyframes tmrTwinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.tmr-btns-wrap{display:flex;flex-direction:column;align-items:center;margin:12px auto 0;width:fit-content}
.tmr-btns-row{display:flex;gap:8px;justify-content:center}
.tmr-btns-row2{display:flex;gap:8px;justify-content:center;width:100%;margin-top:10px}
.tmr-ctrl{border:none;cursor:pointer;padding:9px 14px;border-radius:14px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s;min-width:58px}
.tmr-ctrl:active{transform:scale(.92)}
.tmr-ctrl-ico{font-size:16px;line-height:1}
.tmr-ctrl-lbl{font-size:10px;font-weight:600}
.tmr-ctrl-play{background:linear-gradient(135deg,#ff7aa2,#ff5c8d);color:#fff;box-shadow:0 4px 12px rgba(255,122,162,.35)}
.tmr-ctrl-pause{background:linear-gradient(135deg,#ffd06b,#ffb347);color:#7a4d10;box-shadow:0 4px 12px rgba(255,180,71,.3)}
.tmr-ctrl-reset{background:linear-gradient(135deg,#e8e4f0,#d4cfde);color:var(--ink-2);box-shadow:0 4px 12px rgba(150,130,180,.2)}
.tmr-ctrl-done{background:linear-gradient(135deg,#7ed6a5,#4ecb8a);color:#fff;box-shadow:0 4px 12px rgba(78,203,138,.3);width:100%}
.tmr-ctrl-done:active{animation:tmrPop .3s cubic-bezier(.22,1.4,.36,1)}
.tmr-ctrl-play:active{animation:tmrPop .3s cubic-bezier(.22,1.4,.36,1)}
@keyframes tmrPop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
/* 鼓励动画弹层 */
.cheer-overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s}
.cheer-overlay.on{opacity:1;pointer-events:auto}
.cheer-emoji{font-size:72px;animation:cheerBounce .6s cubic-bezier(.22,1.4,.36,1)}
.cheer-text{font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.3);margin-top:12px;animation:cheerTextIn .5s ease-out .15s both}
.cheer-sub{font-size:14px;font-weight:600;color:rgba(255,255,255,.9);margin-top:6px;animation:cheerTextIn .5s ease-out .3s both}
.cheer-confetti{position:absolute;font-size:20px;animation:cheerConfetti 1.2s ease-out forwards}
@keyframes cheerBounce{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes cheerTextIn{0%{opacity:0;transform:translateY(15px)}100%{opacity:1;transform:translateY(0)}}
@keyframes cheerConfetti{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(120px) rotate(360deg)}}
.tmr-pomo-cfg{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.tmr-cfg-label{font-weight:600;color:var(--ink-2)}
.tmr-cfg-sel{font-size:12px;padding:2px 4px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
.tmr-cfg-sel:disabled{opacity:.5}
.tmr-cfg-sep{color:var(--line)}
.tmr-cfg-round{font-weight:700;color:#e56b8a}
.tmr-plan-sel{margin:6px 0 4px}
.tmr-plan-label{font-size:11px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.tmr-plan-option{width:100%;font-size:12px;padding:6px 8px;border:2px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#faf7ff,#fff);color:var(--ink)}
.tmr-total-hint{font-size:11px;color:var(--ink-2);margin-top:4px;text-align:center;padding:4px;background:var(--bg);border-radius:10px}
.tmr-total-hint b{color:var(--pink);font-size:13px}
/* 按钮 */
.btn{border:none;cursor:pointer;border-radius:99px;padding:9px 16px;font-size:13px;font-weight:700;
  background:linear-gradient(120deg,var(--teal),#7ed6cd);color:#fff;box-shadow:0 4px 10px rgba(94,201,191,.35)}
.btn.pk{background:linear-gradient(120deg,var(--pink),#f9bcd6);box-shadow:0 4px 10px rgba(247,168,201,.35)}
.btn.pp{background:linear-gradient(120deg,var(--purple),#c9b3f5);box-shadow:0 4px 10px rgba(183,156,237,.35)}
.btn.ghost{background:#fff;color:var(--teal-d);border:1.5px solid var(--teal-l);box-shadow:none}
.btn.sm{padding:4px 9px;font-size:11px}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.rowline h3{flex:1;margin:0;font-size:13px}
/* 进度条 */
.bar{height:12px;border-radius:99px;background:#f2edf8;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--purple));transition:.3s}
.bar.pink i{background:linear-gradient(90deg,var(--pink),var(--purple))}
/* 列表项 */
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1.5px dashed var(--line);font-size:13px}
.li:last-child{border-bottom:none}
.li small{color:var(--ink-2);font-size:11px;display:block;margin-top:2px}
.pill{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--teal-l);color:var(--teal-d);flex:none;display:inline-flex;align-items:center;justify-content:center;line-height:1;height:20px;box-sizing:border-box;font-weight:700;white-space:nowrap}
.pill.pk{background:var(--pink-l);color:#e0699e}
.pill.pp{background:var(--purple-l);color:#8a68d8}
.pill.yl{background:#fff3d6;color:#d29a3a}
.pill.hot{background:linear-gradient(120deg,var(--pink-l),var(--purple-l));color:#8a68d8}
.pill.on{background:linear-gradient(120deg,var(--teal-l),#d7f3ef);color:var(--teal-d)}
/* 推送状态横幅（自动化失败提醒） */
.banner{display:flex;align-items:center;gap:8px;font-size:12px;padding:10px 12px;border-radius:12px;margin-bottom:12px;line-height:1.5}
.banner.warn{background:#fff3d6;color:#b07a1f;border:1.5px solid #ffe3a8}
.banner.ok{background:var(--teal-l);color:var(--teal-d);border:1.5px solid #cdeee8}
.amount-in{color:var(--red);font-weight:700}
.amount-out{color:#3aa79c;font-weight:700}
.empty{text-align:center;color:#c9c3d8;font-size:12px;padding:22px 0}
.empty b{font-size:26px;display:block;margin-bottom:6px}
/* 倒计时 */
.count{background:linear-gradient(135deg,#d7f3ef,#ece3fb);border-radius:var(--r);padding:18px 14px;text-align:center;
  border:1.5px solid #fff;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
.count::before,.count::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.5)}
.count::before{width:70px;height:70px;left:-22px;top:-22px}
.count::after{width:90px;height:90px;right:-30px;bottom:-38px}
.count b{font-size:40px;color:var(--teal-d)}
.count .cn{font-size:13px;font-weight:700;margin-bottom:3px}
.count i{font-style:normal;font-size:11px;color:var(--ink-2);display:block;margin-top:2px}
/* 水杯 */
.cups{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:6px 0}
.cup{width:44px;height:52px;border-radius:10px 10px 14px 14px;border:2.5px solid var(--teal-l);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff;transition:.2s;opacity:.55}
.cup.full{background:linear-gradient(180deg,#d7f3ef 20%,#a5e3db);border-color:var(--teal);opacity:1;transform:scale(1.05)}
/* 图表 */
.bars7{display:flex;align-items:flex-end;gap:7px;height:90px;padding-top:6px}
.b7{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.b7 i{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--pink),var(--purple));min-height:3px}
.b7.teal i{background:linear-gradient(180deg,var(--teal),#9adfd7)}
.b7 span{font-size:9px;color:var(--ink-2)}
.b7 em{font-style:normal;font-size:9px;color:var(--ink-2)}
svg.trend{width:100%;height:110px}
/* 模态框 */
#mask{position:fixed;inset:0;background:rgba(80,70,110,.35);z-index:99;display:none;align-items:flex-end;justify-content:center}
#mask.on{display:flex}
#modal{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px 26px;animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
#modal h3{font-size:16px;margin-bottom:14px;text-align:center}
.fld{margin-bottom:11px}
.fld label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;
  background:#fdfbf8;color:var(--ink);outline:none;font-family:inherit}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal)}
.m-btns{display:flex;gap:10px;margin-top:16px}
.m-btns .btn{flex:1;padding:12px}
.fld-calc{
  width:100%;border:2px dashed var(--pink);border-radius:12px;
  padding:10px 12px;font-size:20px;font-weight:700;text-align:center;
  background:linear-gradient(135deg,var(--pink-l),var(--purple-l));
  color:#e0699e;transition:all .25s cubic-bezier(.22,1.4,.36,1);
}
.fld-calc.up{color:var(--teal-d);border-color:var(--teal);background:linear-gradient(135deg,var(--teal-l),#fff)}
/* 行内双字段（预计时长/实际用时等） */
.fld-row{margin-bottom:11px}
.fld-row-label{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.fld-row-calc{font-size:12px;font-weight:700;color:var(--teal-d);background:var(--teal-l);padding:2px 10px;border-radius:99px;white-space:nowrap;transition:all .25s cubic-bezier(.22,1.4,.36,1)}
.fld-row-inner{display:flex;gap:6px}
.fld-row-item{flex:1;min-width:0}
.fld-row-item input,.fld-row-item select{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 8px;font-size:14px;font-weight:600;background:#fdfbf8;color:var(--ink);outline:none;text-align:center;text-align-last:center}
.fld-row-item input:focus,.fld-row-item select:focus{border-color:var(--teal)}
/* 多选列表 */
.fld-ms{display:flex;flex-wrap:wrap;gap:6px;max-height:200px;overflow-y:auto}
.ms-item{display:flex;align-items:center;gap:4px;padding:6px 10px;border:2px solid var(--line);border-radius:99px;font-size:12px;font-weight:600;background:#fdfbf8;color:var(--ink-2);cursor:pointer;user-select:none}
.ms-item:has(input:checked){border-color:var(--pink);background:var(--pink-l);color:var(--pink-d)}
.ms-item input{display:none}
/* 时长选择器：小时和分钟中间加冒号分隔 */
.fld-time .fld-row-inner{position:relative;gap:0}
.fld-time .fld-row-item:first-child select{border-radius:12px 4px 4px 12px}
.fld-time .fld-row-item:last-child select{border-radius:4px 12px 12px 4px;margin-left:-2px}
.fld-time .fld-row-inner::after{content:':';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:700;color:var(--ink-2);z-index:2;pointer-events:none}
/* toast */
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(77,74,92,.92);color:#fff;
  padding:9px 18px;border-radius:99px;font-size:13px;z-index:120;display:none;white-space:nowrap}
/* 浮动加号 */
#fab{position:fixed;right:18px;bottom:max(24px, env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:none;z-index:60;
  background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:26px;cursor:pointer;
  box-shadow:0 6px 16px rgba(183,156,237,.45)}
.gear{border:none;background:#fff;border-radius:12px;width:36px;height:36px;font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
.mini-stats{display:flex;gap:10px}
.mini{flex:1;text-align:center;background:#faf7ff;border-radius:14px;padding:10px 4px}
.mini b{font-size:17px;display:block}
.mini i{font-style:normal;font-size:10px;color:var(--ink-2)}
.subj{margin-bottom:11px}
.subj .rowline{margin-bottom:5px;font-size:13px}
.wish-ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--pink);flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.wish.done .wish-ck{background:var(--pink)}
.wish.done .w-t{text-decoration:line-through;color:var(--ink-2)}
.catbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.catbar .bar{flex:1}
.catbar b{width:56px;text-align:right;flex:none;font-size:11px}
.catbar span{width:52px;flex:none}
input[type="file"]{display:none}
/* ---------- 上岸模块：底部功能导航 ---------- */
#exambar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;gap:1px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-top:2px dashed var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -6px 20px rgba(150,130,180,.16);
  padding:5px 4px max(5px,env(safe-area-inset-bottom))}
body.exam-on #exambar{display:flex}
body.exam-on #fab{display:none}
body.exam-on #main{padding-bottom:140px}
.eb{flex:1;min-width:0;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink-2);padding:2px 0}
.eb i{font-style:normal;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:#f6f2fa;border:2px solid transparent;transition:.2s}
.eb span{font-size:9px;letter-spacing:.3px}
.eb.on{color:var(--ink)}
.eb.on span{font-weight:700}
.eb.on i{background:linear-gradient(135deg,var(--teal-l),var(--purple-l));border-color:#fff;box-shadow:var(--shadow);transform:scale(1.08)}
/* 打卡日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;align-items:center}
.cal .cw{font-size:10px;color:var(--ink-2)}
.cd{aspect-ratio:1;border-radius:12px;background:#faf7ff;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid transparent}
.cd em{font-style:normal;font-size:8.5px;color:var(--teal-d);font-weight:700}
.cd.on{background:linear-gradient(135deg,#d7f3ef,#ece3fb);border-color:#fff;box-shadow:var(--shadow)}
.cd.td{border-color:var(--pink)}
/* 滚轴选择器 */
.wheelwrap{position:relative;height:180px;margin:6px 0}
.wheel{height:180px;overflow-y:auto;scroll-snap-type:y mandatory;text-align:center}
.wheel::-webkit-scrollbar{display:none}
.wv{height:36px;line-height:36px;scroll-snap-align:center;font-size:19px;color:var(--ink-2);font-weight:700}
.wsp{height:72px}
.wheelline{position:absolute;left:14%;right:14%;top:72px;height:36px;border-top:2.5px solid var(--teal);border-bottom:2.5px solid var(--teal);pointer-events:none;border-radius:10px;background:rgba(94,201,191,.07)}
.wheelunit{position:absolute;right:16%;top:80px;font-size:12px;color:var(--teal-d);pointer-events:none}
/* 媒体输入 */
.mrow{display:flex;gap:8px;margin:2px 0 8px}
.mbtn{flex:1;border:1.8px dashed #cfe9e5;background:#fbfffe;border-radius:12px;padding:9px 0;font-size:12px;color:var(--teal-d);cursor:pointer;font-family:inherit}
.mbtn.rec{background:#ffe9e9;border-color:var(--red);color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
#mprev{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.mth{position:relative;display:inline-flex;align-items:center}
.mth .del{position:absolute;top:-9px;right:-9px;background:#fff;border-radius:50%;box-shadow:var(--shadow);width:20px;height:20px;line-height:18px}
.mi-th{width:56px;height:56px;border-radius:10px;object-fit:cover;border:2px solid #fff;box-shadow:var(--shadow);cursor:pointer}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
audio{width:100%;height:34px;margin-top:5px}
.dict{border:none;background:var(--purple-l);color:#8a68d8;border-radius:8px;font-size:11px;padding:3px 9px;cursor:pointer;margin-left:6px;font-family:inherit}
#imgview{position:fixed;inset:0;background:rgba(30,25,45,.92);z-index:200;display:none;align-items:center;justify-content:center}
#imgview.on{display:flex}
#imgview img{max-width:96%;max-height:92%;border-radius:12px}
/* 知识点大纲 */
.kp{padding:8px 2px;border-bottom:1.5px dashed var(--line)}
.kp:last-child{border-bottom:none}
.kp small{display:block;color:var(--ink-2);font-size:11px;margin-top:3px;line-height:1.6}
.kp .kp-way{color:#8a68d8}
.kp-m{font-size:11.5px;background:#f2fbf9;border-radius:10px;padding:8px 10px;margin-bottom:8px;line-height:1.7;color:var(--teal-d)}
.mast{font-size:10px;padding:3px 9px;border-radius:99px;background:#f6f2fa;color:var(--ink-2);cursor:pointer;flex:none}
.mast.good{background:var(--teal-l);color:var(--teal-d);font-weight:700}
.mast.mid{background:#fff3d6;color:#d29a3a;font-weight:700}
.mast.weak{background:#ffe2e2;color:var(--red);font-weight:700}
/* 积累 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:none;display:inline-flex;align-items:center;justify-content:center;background:#f6f2fa;border-radius:99px;padding:4px 9px;font-size:11px;color:var(--ink);text-decoration:none;cursor:pointer;font-family:inherit;flex:none;line-height:1;min-height:22px;box-sizing:border-box}
.chip.hot{background:linear-gradient(120deg,var(--pink-l),var(--purple-l));font-weight:700}
.chip.on{background:linear-gradient(120deg,var(--teal-l),#d7f3ef);color:var(--teal-d);font-weight:700}
.chip.pk{background:var(--pink-l);color:#e0699e}
.chip.pp{background:var(--purple-l);color:#8a68d8}
/* 官媒直达 - 规整网格 */
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.news-grid .chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 4px;font-size:13px;font-weight:600;border-radius:14px;min-height:52px;
  background:linear-gradient(145deg,#faf7ff,#fff);border:2px solid var(--line);
  transition:all .25s cubic-bezier(.22,1.4,.36,1);position:relative;
}
.news-grid .chip em{font-style:normal;font-size:14px;margin-top:2px}
.news-grid .chip:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--pink)}
.news-grid .chip.hot{background:linear-gradient(145deg,var(--pink-l),var(--purple-l));border-color:#fff}
/* 时政推送标签 & 操作分组 */
.feed-tags{display:flex;align-items:center;gap:4px;margin-top:8px;margin-bottom:4px;flex-wrap:wrap;line-height:1.6}
.feed-tags .pill{font-size:10px;height:19px;padding:2px 8px}
.feed-actions{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap;line-height:1.6}
.feed-actions .chip{font-size:11px;min-height:22px}
/* 科目功能导航键 */
.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.subj-card{background:#fff;border-radius:var(--r);padding:14px 10px;box-shadow:var(--shadow);border:1.5px solid #fff;text-align:center;position:relative;cursor:pointer;transition:.18s}
.subj-card:active{transform:scale(.97)}
.subj-ic{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--teal-l),var(--pink-l));display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 8px;border:2px solid #fff;box-shadow:var(--shadow)}
.subj-name{font-size:14px;font-weight:700;margin-bottom:4px}
.subj-meta{font-size:10px;color:var(--ink-2)}
.subj-meta b{color:var(--teal-d)}
.subj-arrow{position:absolute;right:8px;top:8px;font-size:14px;color:var(--pink)}
/* 科目详情页 */
.subj-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;background:linear-gradient(135deg,var(--purple),var(--pink));border-radius:var(--r);color:#fff;box-shadow:var(--shadow)}
.subj-back{width:34px;height:34px;border-radius:12px;border:none;background:rgba(255,255,255,.25);color:#fff;font-size:18px;cursor:pointer}
.subj-title{font-size:17px;font-weight:700}
.subj-hero{background:#fff;border-radius:var(--r);padding:12px 14px;font-size:12px;line-height:1.8;color:var(--teal-d);border:1.5px solid #fff;box-shadow:var(--shadow);margin-bottom:12px}
.subj-stats3{display:flex;gap:10px;margin-bottom:14px}
.sst{flex:1;background:#fff;border-radius:var(--r);padding:12px 4px;text-align:center;box-shadow:var(--shadow);border:1.5px solid #fff;cursor:pointer}
.dyn-list .li{padding:9px 0;border-bottom:1px dashed var(--line)}
.dyn-list .li:last-child{border-bottom:none}
.empty-in{font-size:12px;color:var(--ink-2);padding:12px 0;text-align:center;line-height:1.7}
.sst b{font-size:20px;display:block;color:var(--purple)}
.sst i{font-style:normal;font-size:10px;color:var(--ink-2)}
.out-sec{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(150,130,180,.06);border:1.5px solid #fff}
.out-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer}
.out-hd b{font-size:13px}
.freq{font-size:9px;padding:2px 7px;border-radius:99px;margin-left:5px;font-weight:700}
.freq.hi{background:#ffe2e2;color:var(--red)}
.freq.mid{background:#fff3d6;color:#d29a3a}
.out-body small{display:block;color:var(--ink-2);font-size:11px;line-height:1.6;margin-top:3px}
.method-scroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px}
.method-scroll::-webkit-scrollbar{display:none}
.method-card{flex:none;width:200px;background:linear-gradient(135deg,var(--pink-l),var(--purple-l));border-radius:14px;padding:12px;border:1.5px solid #fff}
.method-card b{font-size:12px;display:block;margin-bottom:5px}
.method-card p{font-size:11px;color:var(--ink-2);line-height:1.6}
/* 学习计划卡片 */
.plan-item{padding:10px 0;border-bottom:1.5px dashed var(--line)}
.plan-item:last-child{border-bottom:none}
.plan-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.plan-type{font-size:10px;padding:3px 9px;border-radius:99px;flex:none}
.plan-name{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-meta{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px}
.plan-count{font-size:12px;color:var(--ink-2)}
.plan-count b{color:var(--teal-d);font-size:14px}
.plan-btns{display:flex;gap:5px;align-items:center}
.plan-btns .btn.sm{padding:4px 9px;font-size:11px}
.plan-btns .del{font-size:13px;padding:2px}
.plan-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.plan-foot small{font-size:10px;color:#b06fd0}
/* 统计报表 */
.report-head,.report-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:8px 4px;font-size:11px;border-bottom:1.5px dashed var(--line)}
.report-head{font-weight:700;color:var(--ink-2);background:#faf7ff;border-radius:10px 10px 0 0;border-bottom:none}
.report-row:last-child{border-bottom:none}
/* 省份速查表：3列布局，别称/古称列更宽 */
.prov-table .report-head,.prov-table .report-row{grid-template-columns:1.2fr 0.8fr 3fr}
.prov-table .report-row span:last-child{white-space:normal;line-height:1.5;font-size:12px}
/* 常识做题卡片 */
.quiz-card{background:#fff;border-radius:16px;padding:14px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.quiz-opt{transition:all .15s}
.quiz-opt:active:not([disabled]){transform:scale(.97)}
/* 时政考点提炼 */
.point-box{background:#fff9f3;border-radius:12px;padding:10px 12px;margin:8px 0;border:1.5px dashed #ffe0c7;line-height:1.7;font-size:12px;color:#a87040}
.point-box::before{content:"🎯 考点提炼";display:block;font-weight:700;margin-bottom:4px;color:#d68935}
/* 背诵页大按钮 */
.bigbtns{display:flex;gap:10px;justify-content:flex-end;margin-bottom:6px}
.bigbtn{border:none;border-radius:18px;padding:10px 14px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(183,156,237,.3);display:flex;align-items:center;gap:5px;transition:transform .15s,box-shadow .2s}
.bigbtn:active{transform:scale(.95)}
.bigbtn.recite{background:linear-gradient(135deg,var(--pink),#f9bcd6)}
.bigbtn.norm{background:linear-gradient(135deg,var(--purple),#c9b3f5)}
/* 背诵卡片 */
.rec-card{border-radius:14px;padding:12px;background:#fdfbf8;border:1.5px solid #f0e6f5;margin-bottom:10px;transition:transform .18s,box-shadow .18s}
.rec-card:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(150,130,180,.1)}
.rec-card .rec-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rec-card .rec-title{font-size:14px;font-weight:700;flex:1;word-break:break-all}
.rec-card .rec-body{font-size:12.5px;color:var(--ink);line-height:1.7;white-space:pre-wrap;padding:6px 0}
.rec-card .rec-meta{display:flex;align-items:center;gap:8px;margin-top:8px}
.rec-card .rec-toggle{color:var(--ink-2);font-size:11px;cursor:pointer;display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:99px;background:#f6f2fa;transition:background .15s}
.rec-card .rec-toggle:hover{background:#ece3fb}
.rec-card .rec-actions{display:flex;gap:6px;align-items:center;margin-left:auto}
/* 规范词卡片精简 */
.norm-card{border-radius:14px;padding:12px;background:#fdfbf8;border:1.5px solid #f0e6f5;margin-bottom:10px}
.norm-card .norm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.norm-card .norm-topic{font-size:11px;color:#8a68d8;background:#f4edff;padding:2px 8px;border-radius:99px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 扫描线 */

/* 应用动画的类 */
.anim-slide{animation:slideIn .35s cubic-bezier(.22,1,.36,1)}
.anim-slideup{animation:slideUp .4s cubic-bezier(.22,1,.36,1)}
.anim-scale{animation:scaleIn .3s cubic-bezier(.22,1,.36,1)}
.anim-fade{animation:fadeIn .25s ease}

/* 卡片带stagger延迟 */
.card{animation:cardPop .35s cubic-bezier(.22,1,.36,1) both}
.card:nth-child(1){animation-delay:.0s}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}
.card:nth-child(5){animation-delay:.16s}
.card:nth-child(6){animation-delay:.20s}
.card:nth-child(7){animation-delay:.24s}
.card:nth-child(8){animation-delay:.28s}

/* 模块卡片 */
.mcard{transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .2s}
.mcard:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 8px 24px rgba(150,130,180,.18)}
.mcard:active{transform:scale(.96)}

/* 按钮 */
.btn{transition:transform .15s,box-shadow .2s,filter .2s;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.4) 0%,transparent 70%);transform:scale(0);transition:transform .3s;border-radius:inherit}
.btn:active{transform:scale(.94)}
.btn:active::after{transform:scale(2)}

/* 导航按钮 */
.nav-btn,.eb{transition:transform .15s}
.nav-btn:active,.eb:active{transform:scale(.9)}

/* 任务项 */
.task{transition:background .2s,transform .2s}
.task:active{transform:translateX(3px)}

/* 浮动按钮 */
#fab{animation:pulse 2s infinite;transition:transform .2s,box-shadow .2s}
#fab:hover{transform:scale(1.08);box-shadow:0 8px 24px rgba(183,156,237,.5)}
#fab:active{transform:scale(.9);animation:none}

/* logo */
.logo{animation:float 3s ease-in-out infinite}
.logo-wrap:hover .logo{animation:none;transform:scale(1.1) rotate(-5deg)}

/* 统计数字 */
.stat b{transition:transform .2s}
.stat:active b{animation:countPop .3s}

/* 水杯 */
.cup{transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.cup:active{transform:scale(.85) rotate(-5deg)}

/* tab */
.tab{transition:transform .15s,box-shadow .2s}
.tab:active{transform:scale(.95)}

/* 删除按钮 */
.del{transition:transform .15s,color .2s}
.del:hover{color:var(--red);transform:scale(1.2)}

/* 空状态 */
.empty b{animation:floatSlow 4s ease-in-out infinite}

/* 倒计时装饰 */
.count::before{animation:float 5s ease-in-out infinite}
.count::after{animation:float 7s ease-in-out infinite reverse}

/* 复选框 */

.ck:active{transform:scale(.85)}

.bar i{transition:width .6s cubic-bezier(.22,1,.36,1)}

/* 图片预览 */
#imgview{transition:opacity .25s}
#imgview img{transition:transform .3s}
#imgview.on img{transform:scale(1)}

/* 日历格 */
.cd{transition:transform .15s,box-shadow .2s}
.cd:active{transform:scale(.92)}

.subj-card{transition:transform .2s,box-shadow .2s}

.method-card:hover{transform:translateX(4px)}

/* 滚轴 */
.wheel{scroll-behavior:smooth}

/* 模态框 */
#mask{transition:opacity .25s}
#modal{transition:transform .3s cubic-bezier(.22,1,.36,1)}

/* toast */

#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.hide{opacity:0;transform:translateX(-50%) translateY(10px)}

/* 科目详情头部 */

#splash{

/* ================= 模态框 ================= */
var mCb=null;
function showModal(title,fields,cb,okText){
  mCb=cb;
  var h='<h3>'+esc(title)+'</h3>';
  fields.forEach(function(f){
    if(f.type==='row'){
      var rowCls=f.cls?(' '+f.cls):'';
      h+='<div class="fld fld-row'+rowCls+'">';
      // 分离普通字段和 calc 字段
      var normFields=[], calcField=null;
      f.fields.forEach(function(sf){ if(sf.type==='readonly'||sf.type==='calc') calcField=sf; else normFields.push(sf); });
      // label 行：calc 字段放右侧做小标签
      h+='<div class="fld-row-label">'+esc(f.label||'')+'';
      if(calcField){
        h+='<span class="fld-row-calc" id="mf-'+calcField.key+'" data-fn="'+esc(calcField.calcFn||'')+'" data-src="'+esc(calcField.srcKeys||'')+'">'+esc(calcField.value||'')+'</span>';
      }
      h+='</div>';
      h+='<div class="fld-row-inner">';
      normFields.forEach(function(sf){
        h+='<div class="fld-row-item">';
        if(sf.type==='select'){
          h+='<select id="mf-'+sf.key+'">';
          sf.options.forEach(function(o){
            var v=typeof o==='string'?o:o.v, t=typeof o==='string'?o:o.t;
            h+='<option value="'+esc(v)+'"'+(sf.value===v?' selected':'')+'>'+esc(t)+'</option>';
          });
          h+='</select>';
        }else{
          h+='<input id="mf-'+sf.key+'" type="'+(sf.type||'text')+'" value="'+esc(sf.value||'')+'" placeholder="'+esc(sf.ph||'')+'">';
        }
        h+='</div>';
      });
      h+='</div></div>';
    }else{
    h+='<div class="fld'+(f.cls?' '+f.cls:'')+'"><label>'+esc(f.label)+'</label>';
    if(f.type==='readonly'||f.type==='calc'){
      h+='<div id="mf-'+f.key+'" class="fld-calc" data-fn="'+esc(f.calcFn||'')+'" data-src="'+esc(f.srcKeys||'')+'">'+esc(f.value||'')+'</div>';
    }else if(f.type==='select'){
      h+='<select id="mf-'+f.key+'">';
      f.options.forEach(function(o){
        var v=typeof o==='string'?o:o.v, t=typeof o==='string'?o:o.t;
        h+='<option value="'+esc(v)+'"'+(f.value===v?' selected':'')+'>'+esc(t)+'</option>';
      });
      h+='</select>';
    }else if(f.type==='textarea'){
      h+='<textarea id="mf-'+f.key+'" rows="3" placeholder="'+esc(f.ph||'')+'">'+esc(f.value||'')+'</textarea>';
    }else if(f.type==='multiselect'){
      h+='<div id="mf-'+f.key+'" class="fld-ms">';
      (f.options||[]).forEach(function(o){
        var v=typeof o==='string'?o:o.v, t=typeof o==='string'?o:o.t;
        h+='<label class="ms-item"><input type="checkbox" value="'+esc(v)+'"><span>'+esc(t)+'</span></label>';
      });
      h+='</div>';
    }else{
      h+='<input id="mf-'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.ph||'')+'"'+(f.step?' step="'+f.step+'"':'')+'>';
    }
    h+='</div>';
    }
  });
  h+='<div class="m-btns"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn pk" onclick="okModal()">'+(okText||'保存 ♡')+'</button></div>';
  $('modal').innerHTML=h;
  $('modal')._fields=fields;
  // 绑定事件：当源字段变化时，自动重算 readonly/calc 字段
  fields.forEach(function(f){
    var subFs = f.type==='row' ? f.fields : [f];
    subFs.forEach(function(sf){
      if(sf.type==='readonly'||sf.type==='calc'){
        var el=$('mf-'+sf.key);
        if(el&&sf.srcKeys&&sf.calcFn){
          var keys=sf.srcKeys.split(',');
          keys.forEach(function(k){
            var src=$('mf-'+k);
            if(src){
              src.addEventListener('input',function(){
                var vals={};
                fields.forEach(function(x){
                  var subFs2 = x.type==='row' ? x.fields : [x];
                  subFs2.forEach(function(sx){ var s=$('mf-'+sx.key); if(s)vals[sx.key]=s.value; });
                });
                var result=eval(sf.calcFn)(vals);
                el.textContent=result;
              });
            }
          });
        }
      }
    });
  });
  $('mask').classList.add('on');
}
function okModal(){
  var vals={}, fs=$('modal')._fields;
  fs.forEach(function(f){
    var subFs = f.type==='row' ? f.fields : [f];
    subFs.forEach(function(sf){
      var el=$('mf-'+sf.key);
      if(el){
        if(sf.type==='readonly'||sf.type==='calc') vals[sf.key]=el.textContent.trim();
        else if(sf.type==='multiselect'){
          var cks=el.querySelectorAll('input[type=checkbox]:checked');
          vals[sf.key]=Array.prototype.slice.call(cks).map(function(c){return c.value});
        }
        else vals[sf.key]=el.value.trim();
      }
    });
  });
  if(mCb(vals)===false) return;
  closeModal();
}

}

// 把一条已完成任务/计划归档到 doneHistory（保留近5天）
function pushDoneHistory(kind,item){
  if(!S.doneHistory)S.doneHistory=[];
  S.doneHistory=S.doneHistory.filter(function(x){return x.id!==item.id});
  var rec={id:item.id,kind:kind,title:item.text||item.title||'',date:item.date||today(),doneAt:today(),
    mod:item.mod||'',subj:item.subj||'',type:item.type||'',estMins:item.estMins||0,actMins:item.actMins||0,
    accuracy:item.accuracy||0,totalCount:item.totalCount||0,correctCount:item.correctCount||0,note:item.finishNote||''};
  S.doneHistory.push(rec);
  pruneDoneHistory();
}
function removeDoneHistory(id){
  if(!S.doneHistory)return;
  S.doneHistory=S.doneHistory.filter(function(x){return x.id!==id});
  pruneDoneHistory();
}
// 只保留最近5天（含今天）
function pruneDoneHistory(){
  if(!S.doneHistory)return;
  var cutoff=new Date(); cutoff.setDate(cutoff.getDate()-4); // 含今天共5天
  var y=cutoff.getFullYear(),m=('0'+(cutoff.getMonth()+1)).slice(-2),dd=('0'+cutoff.getDate()).slice(-2);
  var minDate=y+'-'+m+'-'+dd;
  S.doneHistory=S.doneHistory.filter(function(x){return (x.date||'')>=minDate; });
}

/* ---- 今日状态评估 ---- */
function statusEmoji(level,kind){
  var mood=['😫😩','😔','😐','😊','🤩😆'],
      energy=['💤','🔋','⚡','🚀','🔥'],
      focus=['🌫️','😴','🧐','🎯','💎'];
  var set=kind==='m'?mood:kind==='e'?energy:focus;
  return set[Math.max(0,Math.min(4,(level*1||1)-1))];
}
function statusText(level,kind){
  var mood=['情绪低落','有点不开心','平平淡淡','心情不错','超棒超开心'],
      energy=['精疲力竭','有点疲惫','正常','精力充沛','元气满满'],
      focus=['无法专注','容易分心','还可以','比较专注','心流状态'];
  var set=kind==='m'?mood:kind==='e'?energy:focus;
  return set[Math.max(0,Math.min(4,(level*1||1)-1))];
}
function statusAvg(s){ return s? ((s.mood*1||0)+(s.energy*1||0)+(s.focus*1||0))/3 : 0; }
function planSuggestion(avg, dps){
  // 计算预计总时长
  var planEst=0, planAct=0;
  (dps||[]).forEach(function(p){ planEst+=p.estMins*1||0; planAct+=p.actMins*1||0; });
  var bands=[
    {min:0,max:1.5,label:'💤 今日状态欠佳',hrs:'< 1 h',tip:'只安排最紧急的事，好好休息更重要，状态回来再冲'},
    {min:1.5,max:2.5,label:'😪 状态偏低',hrs:'1~2 h',tip:'以恢复为主，安排 1~2 小时轻量任务，别逼太紧'},
    {min:2.5,max:3.5,label:'🙂 状态一般',hrs:'2~3 h',tip:'中等强度 2~3 小时，劳逸结合，记得中间休息'},
    {min:3.5,max:4.5,label:'✨ 状态不错',hrs:'3~4 h',tip:'状态在线，可以安排 3~4 小时正常学习量'},
    {min:4.5,max:6,label:'🔥 状态超棒',hrs:'4~6 h',tip:'状态拉满！可以挑战 4~6 小时，抓黄金期多啃点硬骨头'}
  ];
  var b=bands[0]; for(var i=0;i<bands.length;i++){ if(avg>=bands[i].min&&avg<bands[i].max){b=bands[i];break;} if(avg>=4.5)b=bands[4]; }
  var diff='';
  if(planEst>0){
    var planH=planEst/60;
    var match=b.hrs.replace(/[^0-9~\.]/g,'').split('~').map(Number);
    var recMin=match[0]||0, recMax=match[1]||match[0]||0;
    if(planH>recMax+0.5) diff='<span style="color:var(--red);font-weight:700">⚠ 安排偏多了，已排 '+Math.round(planH*10)/10+'h，建议精简</span>';
    else if(planH<recMin-0.5) diff='<span style="color:var(--teal-d);font-weight:700">💪 还可以再加量，已排 '+Math.round(planH*10)/10+'h</span>';
    else diff='<span style="color:var(--teal-d)">✅ 量刚刚好（已排 '+Math.round(planH*10)/10+'h）</span>';
  }else{
    diff='<span style="color:var(--ink-2)">还没安排计划，可参考建议时长：<b style="color:var(--purple-d)">'+b.hrs+'</b></span>';
  }
  return {band:b, diff:diff, planEst:planEst, planAct:planAct};
}

// 从已完成清单恢复为未完成
function restoreDone(kind,id){
  if(kind==='task'){
    var found=false;
    S.tasks.forEach(function(k){ if(k.id===id && k.done){ k.done=false; found=true; } });
    if(!found){ toast('找不到原待办，可能已被删除'); }
    removeDoneHistory(id);
  }else if(kind==='dayplan'){
    var p=null; S.exam.dayplans.forEach(function(x){if(x.id===id)p=x});
    if(p && p.done){
      // 调用 dpTg 的取消完成逻辑（会自动 removeDoneHistory）
      dpTg(id);
    }else{
      removeDoneHistory(id);
      toast('找不到原计划，可能已被删除');
    }
  }
  render();
  toast('已恢复为未完成 ↩️');
  openDoneHistory(); // 刷新弹窗
}

function tmrHOpts(){
  var a=[{v:'0',t:'0 时'}];
  for(var i=1;i<=12;i++) a.push({v:String(i),t:i+' 时'});
  return a;
}
function tmrMOpts(){
  var a=[];
  for(var i=0;i<60;i+=5) a.push({v:String(i),t:i+' 分'});
  a.push({v:'1',t:'1 分'},{v:'2',t:'2 分'},{v:'3',t:'3 分'},{v:'4',t:'4 分'});
  a.push({v:'6',t:'6 分'},{v:'7',t:'7 分'},{v:'8',t:'8 分'},{v:'9',t:'9 分'});
  a.sort(function(x,y){return x.v*1-y.v*1});
  return a;
}
// minutes -> "Xh Ym" or "Ym" or ""
function fmtHM(mins){
  mins=(mins*1)||0;
  if(mins<=0) return '';
  var h=Math.floor(mins/60), m=mins%60;
  if(h>0 && m>0) return h+'h'+m+'m';
  if(h>0) return h+'h';
  return m+'m';
}
// 从总分钟数反推 h/m 两个下拉的初值
function splitHM(total){
  total=(total*1)||0;
  return {h:String(Math.floor(total/60)), m:String(total%60)};
}

/* ---- 通用小工具 ---- */
function lineSvg(vals,labels,color){
  if(!vals.length) return emptyHtml('📈','暂无数据');
  var W=320,H=130,pad=16;
  var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
  if(max===min){ max+=1; min=Math.max(0,min-1); }
  var step=vals.length>1?(W-2*pad)/(vals.length-1):0;
  var pts=vals.map(function(v,i){ return [pad+i*step, H-24-((v-min)/(max-min))*(H-52)]; });
  var poly=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  var h='<svg class="trend" viewBox="0 0 320 130" style="height:130px">';
  h+='<polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  var lb=Math.max(1,Math.ceil(vals.length/8));
  pts.forEach(function(p,i){
    h+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2" fill="#fff" stroke="'+color+'" stroke-width="2"/>';
    if(i%lb===0||i===pts.length-1) h+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]-7).toFixed(1)+'" font-size="8.5" fill="#8b88a0" text-anchor="middle">'+vals[i]+'</text>';
  });
  labels.forEach(function(t,i){
    if(t) h+='<text x="'+(pad+i*step).toFixed(1)+'" y="127" font-size="8" fill="#b7b3c9" text-anchor="middle">'+t+'</text>';
  });
  return h+'</svg>';
}
function subjStats(k){

}

function pieSvg(data){
  if(!data.length) return emptyHtml('🍩','还没有学习时长数据');
  var total=data.reduce(function(a,b){return a+b.mins},0), R=55, cx=80, cy=80;
  if(total<=0) return emptyHtml('🍩','还没有学习时长数据');
  var h='<div style="display:flex;justify-content:center;margin:8px 0"><svg viewBox="0 0 160 160" style="width:180px;height:180px;display:block">';
  if(data.length===1){
    // 单科目：直接用 circle 画完整环，避免路径退化
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="'+data[0].color+'" stroke="#fff" stroke-width="2.5"/>';
  }else{
    var start=-Math.PI/2;
    data.forEach(function(d){
      var ang=(d.mins/total)*Math.PI*2;
      if(ang>Math.PI*2-0.001) ang=Math.PI*2-0.001; // 防止整圆退化
      var x1=cx+R*Math.cos(start), y1=cy+R*Math.sin(start);
      var x2=cx+R*Math.cos(start+ang), y2=cy+R*Math.sin(start+ang);
      var large=ang>Math.PI?1:0;
      h+='<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+R+','+R+' 0 '+large+' 1 '+x2+','+y2+' Z" fill="'+d.color+'" stroke="#fff" stroke-width="2.5"/>';
      start+=ang;
    });
  }
  // 中心白色圆，形成甜甜圈效果
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="28" fill="#fff"/>';
  h+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="11" fill="#8b88a0">总计</text>';
  h+='<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#4d4a5c">'+Math.round(total)+'分</text>';
  h+='</svg></div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px">';
  data.forEach(function(d){ h+='<span class="pill" style="background:'+d.color+'22;color:'+d.color+'"><b>'+d.ic+' '+d.n+'</b> '+Math.round(d.mins/total*100)+'%</span>'; });
  return h+'</div>';
}

    var newAct=(v.actH*1||0)*60+(v.actM*1||0);
    p.actMins=newAct;
    // 如果实际时长有变化，同步到 subjTime/checkins
    if(oldAct!==newAct){
      var ds=p.date||today();
      var subj=p.subj||(newPid?(function(){var o=null;S.exam.plans.forEach(function(x){if(x.id===newPid)o=x});return o?o.subj:''})():'');
      if(subj){
        if(!S.exam.subjTime)S.exam.subjTime=[];
        // 先删除旧的记录（按计划id关联的）
        S.exam.subjTime=S.exam.subjTime.filter(function(s){return !(s.src==='dayplan'&&s.refId===p.id)});
        if(newAct>0){
          S.exam.subjTime.push({date:ds,subj:subj,mins:newAct,src:'dayplan',refId:p.id});
        }
        // 重新计算当日 checkins（所有 subjTime 的总和）
        S.exam.checkins[ds]=Math.round(subjTimeDayTotal(ds)/60*10)/10;
      }
    }
    // 如果已完成，并且改变了关联计划或数量，需要先从旧计划扣除进度
    if(wasDone && p.pCounted){
      if(oldPid && (!newPid || newPid!==oldPid)){
        var oldPl=null; S.exam.plans.forEach(function(pl){if(pl.id===oldPid)oldPl=pl});
        if(oldPl) oldPl.done=Math.max(0,oldPl.done*1-(p.n||1));
        p.pCounted=false;
      }else if(newPid && newPid===oldPid && (v.n*1)!==(p.n*1||1)){
        var samePl=null; S.exam.plans.forEach(function(pl){if(pl.id===newPid)samePl=pl});
        if(samePl){
          samePl.done=Math.max(0,samePl.done*1-(p.n||1)); // 先扣旧的
          samePl.done=Math.min(samePl.total*1,samePl.done*1+(v.n*1||1)); // 再加新的
        }
        p.n=v.n*1||1; // 先更新 n，防止下面重复加
        p.pCounted=true; // 保持已计数
        p.text=v.text; p.subj=newPid?(function(){var o=null;S.exam.plans.forEach(function(x){if(x.id===newPid)o=x});return o?o.subj:v.subj})():v.subj; p.date=v.date||today();
        render(); toast('计划已更新 ✏️');
        return;
      }
    }
    // 普通情况更新（未完成，或完成但未改变影响进度的字段）
    p.text=v.text;
    p.subj=newPid?(function(){var o=null;S.exam.plans.forEach(function(x){if(x.id===newPid)o=x});return o?o.subj:v.subj})():v.subj;
    p.date=v.date||today();
    p.planId=newPid;
    if(!p.pCounted) p.n=v.n*1||1;
    
    // 如果变成已完成且新关联了计划，计数
    if(p.done && newPid && !p.pCounted){
      var pl=null; S.exam.plans.forEach(function(x){if(x.id===newPid)pl=x});
      if(pl){ pl.done=Math.min(pl.total*1,pl.done*1+(p.n||1)); p.pCounted=true; }
    }
    if(p.done) pushDoneHistory('dayplan',p); // 刷新已完成归档快照
    render(); toast('计划已更新 ✏️');
  });
}

    if(target.type==='drill' && target.subj && target.correctCount>0){
      // 找最近一条匹配的 drill 记录（同日期同科目同题数）
      for(var i=S.exam.drills.length-1;i>=0;i--){
        var d=S.exam.drills[i];

          S.exam.drills.splice(i,1); break;

      }
      target.totalCount=0; target.correctCount=0; target.accuracy=0;

    if(target.planId && target.pCounted){
      var pl=null; S.exam.plans.forEach(function(x){if(x.id===target.planId)pl=x});
      if(pl){ pl.done=Math.max(0,pl.done*1-(target.n||1)); target.pCounted=false; }
    }
    if(target.actMins>0){
      S.exam.subjTime=(S.exam.subjTime||[]).filter(function(s){return !(s.src==='dayplan'&&s.refId===target.id)});

      if(!S.exam.checkins[target.date||today()]) delete S.exam.checkins[target.date||today()];
    }
    target.actMins=0;
    render();
  }

/* ---- 专注计时器 / 番茄钟 ---- */
var tmrTick=null;
function tmrNow(){ return Date.now(); }
function tmrCurMins(){
  // 当前显示的"已完成分钟数"：累计 + 当前running期间
  var t=S.timer, e=t.elapsed||0;
  if(t.running) e += tmrNow() - (t.startTs||0);
  return Math.floor(e/60000);
}
function tmrCurSecs(){
  var t=S.timer, e=t.elapsed||0;
  if(t.running) e += tmrNow() - (t.startTs||0);
  return Math.floor(e/1000);
}
function tmrRemainSecs(){
  // 番茄钟模式下，当前阶段的剩余秒数
  var t=S.timer;
  if(t.mode!=='pomodoro') return 0;
  var total=t.phase==='work'?(t.workMins*60):(t.breakMins*60);
  return Math.max(0, total - tmrCurSecs());
}
function tmrDisplayTime(){
  var t=S.timer;
  if(t.mode==='pomodoro'){
    var r=tmrRemainSecs();
    var m=Math.floor(r/60), s=r%60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }else{
    var sec=tmrCurSecs();
    var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
    return (h>0?(h<10?'0':'')+h+':':'')+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
}
function tmrProgress(){
  var t=S.timer;
  if(t.mode!=='pomodoro') return 0;
  var total=(t.phase==='work'?t.workMins:t.breakMins)*60;
  var cur=tmrCurSecs();
  return Math.min(1, cur/total);
}
function tmrPlanOpts(){
  var dps=S.exam&&S.exam.dayplans?S.exam.dayplans:[];
  var td=today();
  var opts=[{v:'',t:'（不关联计划）'}];
  // 分类：今日/逾期/已完成
  var todayList=[], overList=[], doneList=[];
  dps.forEach(function(p){
    if(!p||!p.id) return;
    if(p.done) doneList.push(p);
    else if(p.date===td) todayList.push(p);
    else if(p.date && p.date<td) overList.push(p);
  });
  // 今日计划（最优先）
  if(todayList.length){
    opts.push({v:'__today__',t:'—— 今日计划 ——',disabled:true});
    todayList.forEach(function(p){
      var text=p.text||p.title||'未命名';
      var label=(p.done?'✅':'○')+esc(text).slice(0,18)+(text.length>18?'…':'');
      if(p.estMins) label+=' ·~'+p.estMins+'m';
      opts.push({v:p.id, t:label});
    });
  }
  // 逾期计划
  if(overList.length){
    opts.push({v:'__over__',t:'—— 逾期计划 ——',disabled:true});
    overList.forEach(function(p){
      var text=p.text||p.title||'未命名';
      var label='⏰ '+esc(text).slice(0,18)+(text.length>18?'…':'');
      if(p.estMins) label+=' ·~'+p.estMins+'m';
      opts.push({v:p.id, t:label});
    });
  }
  // 已完成计划（次要）
  if(doneList.length){
    opts.push({v:'__done__',t:'—— 已完成 ——',disabled:true});
    doneList.forEach(function(p){
      var text=p.text||p.title||'未命名';
      var label='✅ '+esc(text).slice(0,18)+(text.length>18?'…':'');
      if(p.estMins) label+=' ·~'+p.estMins+'m';
      opts.push({v:p.id, t:label});
    });
  }
  return opts;
}
function tmrStart(){
  var t=S.timer;
  if(t.running) return;
  t.running=true;
  t.startTs=tmrNow();
  tmrSave();
  tmrLoop();
}
function tmrPause(){
  var t=S.timer;
  if(!t.running) return;
  t.elapsed += tmrNow() - (t.startTs||0);
  t.running=false;
  t.startTs=0;
  tmrSave();
  tmrStopLoop();
  render();
}
function tmrReset(){
  S.timer.running=false;
  S.timer.startTs=0;
  S.timer.elapsed=0;
  S.timer.phase='work';
  S.timer.round=0;
  tmrSave();
  tmrStopLoop();
  render();
}
function tmrSave(){ save(); }
function tmrLoop(){
  tmrStopLoop();
  tmrTick=setInterval(function(){
    var t=S.timer;
    // 番茄钟阶段切换
    if(t.mode==='pomodoro' && t.running){
      var remain=tmrRemainSecs();
      if(remain<=0){
        // 阶段结束
        if(t.phase==='work'){
          // 完成一个番茄：自动记录时长到关联计划/科目
          tmrCommitWork(t.workMins);
          t.round=(t.round||0)+1;
          t.phase='break';
          t.elapsed=0;
          t.startTs=tmrNow();
          toast('🍅 番茄 '+t.workMins+' 分钟完成！休息 '+t.breakMins+' 分钟');
          // 休息阶段不自动停止，让用户决定
        }else{
          t.phase='work';
          t.elapsed=0;
          t.startTs=tmrNow();
          toast('☕ 休息结束，开始下一个番茄');
        }
        tmrSave();
        render();
        return;
      }
    }
    // 只更新显示，不重新渲染整个页面
    var el=$('tmr-time');
    if(el){
      el.textContent=tmrDisplayTime();
      // 更新进度环
      var ring=$('tmr-ring');
      if(ring){
        var p=tmrProgress();
        var r=78, c=2*Math.PI*r;
        ring.setAttribute('stroke-dashoffset',c*(1-p));
        ring.setAttribute('transform','rotate(-90 110 110)');
      }
      // 更新状态文字
      var phase=$('tmr-phase');
      if(phase){
        var working=t.mode==='pomodoro'&&t.phase==='work';
        phase.textContent=working?'专注中…加油！':'休息一下～喝口水';
      }
    }else{
      // 元素不存在（切到别的页面），停止循环
      tmrStopLoop();
    }
  }, 1000);
}
function tmrStopLoop(){
  if(tmrTick){ clearInterval(tmrTick); tmrTick=null; }
}
function tmrCommitWork(mins, alsoComplete, extraActMinsOverride){
  var t=S.timer;
  if(mins<=0) return;
  var ds=today();
  // 关联到今日计划
  if(t.planId){
    var p=null; S.exam.dayplans.forEach(function(x){if(x.id===t.planId)p=x});
    if(p){
      // ---------- 防重复：同一计划 ID 只允许加一次计时时长到 actMins ----------
      if(!t.committedPlans) t.committedPlans={};
      var alreadyCommitted = !!t.committedPlans[p.id];
      // subjTime 和打卡总是同步（保证科目累计准确），但 actMins 只在首次记入时累加
      var subj=p.subj;
      if(subj){
        if(!S.exam.subjTime)S.exam.subjTime=[];
        // 先清理同一计划之前的 timer 记录（防止重复）
        S.exam.subjTime=S.exam.subjTime.filter(function(s){return !(s.src==='timer'&&s.refId===p.id)});
        S.exam.subjTime.push({date:ds,subj:subj,mins:mins,src:'timer',refId:p.id});
        S.exam.checkins[ds]=Math.round(subjTimeDayTotal(ds)/60*10)/10;
      }
      // actMins：额外传入覆盖值（例如同时完成计划时用累计值）或首次记入时累加
      if(extraActMinsOverride!==undefined && extraActMinsOverride!==null){
        p.actMins = Math.max(p.actMins*1||0, extraActMinsOverride*1);
      } else if(!alreadyCommitted){
        p.actMins=(p.actMins*1||0)+mins;
      }
      t.committedPlans[p.id]=true;
      // ---------- 同时完成计划 ----------
      if(alsoComplete && !p.done){
        _tmrCompleteDayplan(p, mins);
        showCheer();
      }
      var msg='⏱ '+fmtHM(mins);
      if(alsoComplete) msg += '，计划已打钩完成';
      if(alreadyCommitted && extraActMinsOverride===undefined) msg += '（已记入过，时长不重复累加）';
      toast(msg);
      return;
    }
  }
  // 没关联计划，但有科目
  if(t.subj){
    if(!S.exam.subjTime)S.exam.subjTime=[];
    S.exam.subjTime.push({date:ds,subj:t.subj,mins:mins,src:'timer'});
    S.exam.checkins[ds]=Math.round(subjTimeDayTotal(ds)/60*10)/10;
    toast('⏱ '+fmtHM(mins)+' 已记入打卡');
  }
}
// 把计划标记为完成（复用 dpTg 里的完成逻辑，但避免再次覆盖 actMins）
function _tmrCompleteDayplan(p, tmrMins){
  p.done=true;
  p.finishDate=today();  // 记录实际完成日期（可能与计划 date 不同）
  // 如果 actMins 已经被计时填充了一个更大的值，就用那个；否则用计时器
  p.actMins = Math.max(p.actMins*1||0, tmrMins*1||0);
  pushDoneHistory('dayplan',p);
  if(p.planId){
    var pl=null; S.exam.plans.forEach(function(x){if(x.id===p.planId)pl=x});
    if(pl&&!p.pCounted){ pl.done=Math.min(pl.total*1,pl.done*1+(p.n||1)); p.pCounted=true; }
  }
  var m=p.actMins*1||0;
  var fd=p.finishDate;
  if(m>0 && p.subj){
    if(!S.exam.subjTime)S.exam.subjTime=[];
    // 去重：dayplan 只保留一条（最新的）
    S.exam.subjTime=S.exam.subjTime.filter(function(s){return !(s.src==='dayplan'&&s.refId===p.id)});
    S.exam.subjTime.push({date:fd,subj:p.subj,mins:m,src:'dayplan',refId:p.id});
    S.exam.checkins[fd]=Math.round(subjTimeDayTotal(fd)/60*10)/10;
  }
  // 做题类型：自动生成 drill 记录
  if(p.type==='drill' && p.subj && p.totalCount>0 && p.correctCount>=0){
    var pname='';
    if(p.planId){
      var p2=null; S.exam.plans.forEach(function(x){if(x.id===p.planId)p2=x});
      if(p2) pname=p2.name;
    }
    // 防重复：找最近一条匹配的，如果已经存在就不重复加
    var dup=false;
    for(var di=S.exam.drills.length-1;di>=0;di--){
      var dd=S.exam.drills[di];
      if(dd.date===fd && dd.subj===p.subj && dd.count===p.totalCount && dd.correct===p.correctCount){ dup=true; break; }
    }
    if(!dup){
      S.exam.drills.push({id:uid(),date:fd,subj:p.subj,count:p.totalCount,correct:p.correctCount,minutes:m,source:'',plan:pname});
    }
  }
}
function tmrFinishAndCommit(){
  // 用户主动"完成并记入"：把当前已运行时长记入
  var t=S.timer;
  var mins=tmrCurMins();
  if(mins<1){
    toast('时长太短，至少 1 分钟才能记入');
    return;
  }
  // 如果关联了今日计划，先询问是否同时完成该计划
  if(t.planId){
    var p=null; S.exam.dayplans.forEach(function(x){if(x.id===t.planId)p=x});
    if(p && !p.done){
      var planPreview = p.text.length>18 ? p.text.slice(0,18)+'…' : p.text;
      var alreadyCommitted = t.committedPlans && t.committedPlans[p.id];
      var hint = '';
      if(alreadyCommitted) hint='<div style="font-size:11px;color:var(--ink-2);margin-top:4px">⚠️ 该计划之前已记过时长，actMins 不会重复累加哦</div>';
      if(p.type==='drill'){
        // 做题类型：完整表单（含题目数、正确数、正确率）
        showModal('⏱ 计时结束（'+fmtHM(mins)+'）',[
          {key:'alsoDone',label:'是否同时完成该计划？',type:'select',options:[
            {v:'yes',t:'✅ 完成并打钩（推荐）'},{v:'no',t:'仅记入时长，不打钩'}
          ],value:'yes'},
          {key:'totalCount',label:'总共做了多少题',type:'number',ph:'例如：20',value:p.totalCount||''},
          {key:'correctCount',label:'做对了多少题',type:'number',ph:'例如：16',value:p.correctCount||''},
          {key:'accuracy',label:'正确率',type:'readonly',value:'--',cls:'fld-acc',
            srcKeys:'totalCount,correctCount',
            calcFn:'function(vals){var t=(vals.totalCount||0)*1,c=(vals.correctCount||0)*1; if(!t)return"--"; return Math.round(c/t*100)+"%";}'},
          {key:'note',label:'备注/心得（选填）',ph:'哪里容易错？下次注意～'}
        ],function(v){
          var tc=v.totalCount*1, cc=v.correctCount*1;
          if(v.alsoDone==='yes'){
            if(!(tc>0)){toast('做题数要大于 0 哦');return false}
            if(cc>tc){toast('正确数不能超过做题数');return false}
            p.totalCount=tc; p.correctCount=cc; p.accuracy=Math.round(cc/tc*100);
            p.finishNote=v.note||'';
          }
          tmrCommitWork(mins, v.alsoDone==='yes');
          tmrReset();
          render();
          if(v.alsoDone==='yes' && p.accuracy>0){ toast('🎉 正确率 '+p.accuracy+'%，已自动记入做题记录 ✨'); }
          return true;
        },'记入完成');
      } else {
        // 其他类型：简单确认
        mCb=null;
        $('modal').innerHTML='<h3>⏱ 计时结束（'+fmtHM(mins)+'）</h3>'
          +'<p style="font-size:13px;color:var(--ink);text-align:center;padding:6px 4px 10px">关联计划：<b style="color:var(--purple)">'+esc(planPreview)+'</b></p>'
          +hint
          +'<div class="m-btns"><button class="btn ghost" onclick="closeModal();toast(\'已取消\')">仅记入时长</button><button class="btn pk" id="m-yes">✅ 同时完成该计划</button></div>';
        $('m-yes').onclick=function(){
          closeModal();
          tmrCommitWork(mins, true);
          tmrReset();
          render();
        };
        // "仅记入时长" 的按钮也绑定实际行为
        setTimeout(function(){
          var btns=$('modal').querySelectorAll('.btn.ghost');
          if(btns&&btns[0]){
            btns[0].onclick=function(){
              closeModal();
              tmrCommitWork(mins, false);
              tmrReset();
              render();
            };
          }
        },0);
        $('mask').classList.add('on');
      }
      return;
    }
  }
  // 未关联计划，或计划已完成：直接记入
  tmrCommitWork(mins, false);
  tmrReset();
  render();
}

$('img-in').addEventListener('change',function(e){
  var f=e.target.files[0]; e.target.value='';
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width,hh=img.height,max=900;
      if(w>max){hh=Math.round(hh*max/w);w=max}
      var cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      MBUF.imgs.push(cv.toDataURL('image/jpeg',0.55));
      drawMPrev(); toast('图片已添加 🖼');
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
});
function recToggle(){
  var btn=$('recbtn');
  if(recRec){ try{recRec.stop()}catch(e){} return; }
  if(!navigator.mediaDevices||!window.MediaRecorder){ toast('当前环境不支持录音 🥲'); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var chunks=[], mr=new MediaRecorder(st); recRec=mr;
    var t0=Date.now();
    btn.classList.add('rec'); btn.textContent='⏹ 停止 0:00';
    recTimer=setInterval(function(){
      var s=Math.floor((Date.now()-t0)/1000);
      btn.textContent='⏹ 停止 '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
      if(s>=120){ try{mr.stop()}catch(e){} }
    },500);
    mr.ondataavailable=function(ev){ chunks.push(ev.data); };
    mr.onstop=function(){
      clearInterval(recTimer); recRec=null;
      st.getTracks().forEach(function(tr){tr.stop()});
      if(btn&&btn.isConnected){ btn.classList.remove('rec'); btn.textContent='🎙 录音'; }
      var bl=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
      var rd=new FileReader();
      rd.onload=function(){ MBUF.audios.push(rd.result); drawMPrev(); toast('语音条已添加 🎙'); };
      rd.readAsDataURL(bl);
    };
    mr.start();
  }).catch(function(){ toast('无法访问麦克风，请检查权限'); });
}
function stopMedia(){
  try{ if(recRec)recRec.stop(); }catch(e){}
  try{ if(dictRec)dictRec.stop(); }catch(e){}
  dictRec=null;
}
function startDict(target){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('此浏览器不支持语音转文字，可用录音条代替 🎙'); return; }
  if(dictRec){ try{dictRec.stop()}catch(e){} dictRec=null; return; }
  var r=new SR(); dictRec=r;
  r.lang='zh-CN'; r.interimResults=false; r.continuous=true;
  toast('正在聆听…再点一次结束 🗣');
  r.onresult=function(e){
    var s='';
    for(var i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal)s+=e.results[i][0].transcript; }
    var el=$(target); if(el&&s){ el.value=(el.value?el.value:'')+s; }
  };
  r.onerror=function(){ toast('识别没成功，再试一次或改用录音'); dictRec=null; };
  r.onend=function(){ dictRec=null; };
  r.start();
}

function savePaper(isXc){
  isXc=isXc==='true';
  var name=$('pp-name').value.trim();
  var score=$('pp-score').value.trim();
  if(!name||!score){toast('名称和总分要填哦');return false}
  var secs=[],R=0,A=0;
  (isXc?XC_SEC:SL_SEC).forEach(function(n,i){
    var p=($('pp-s'+i).value||'').split('/');
    if(isXc){ var r2=p[0]*1||0,a2=p[1]*1||0; R+=r2;A+=a2; secs.push({name:n,right:r2,all:a2}); }
    else secs.push({name:n,got:p[0]*1||0,full:p[1]*1||0});
  });
  S.exam.papers.push({id:uid(),type:isXc?'xc':'sl',name:name,date:$('pp-date').value||today(),score:score*1,minutes:$('pp-min').value*1||0,secs:secs,notes:$('pp-notes').value.trim(),acc:(isXc&&A>0)?Math.round(R/A*100):null});
  closeModal(); render(); toast('试卷已归档，看看趋势 📈');
}

var cxGameState={kind:'',round:0,score:0,total:0,q:{},picked:[]};
function shuffleArr(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;} return b;}
function cxStart(kind){
  cxGameMode=kind;
  cxGameState={kind:kind,round:0,score:0,total:0,q:{},picked:[]};
  nextCxQ(kind);
  render();
}
function nextCxQ(kind){
  cxGameState.round++;
  var q=null;
  if(kind==='prov'){ // 省份 → 简称
    var list=CX_PROVINCE.filter(function(x){return x[1].length<=4});
    var it=list[Math.floor(Math.random()*list.length)];
    var opts=shuffleArr([it[1].split('/')[0]]
      .concat(shuffleArr(list.filter(function(x){return x[0]!==it[0]}).slice(0,3).map(function(x){return x[1].split('/')[0]}))));
    q={title:'「'+it[0]+'」的简称是？',opts:opts,ans:it[1].split('/')[0],tip:it[0]+' = '+it[1]+'（古称：'+it[2]+'）'};
  }else if(kind==='old'){ // 城市 → 古称
    var it2=CX_CITY_OLD[Math.floor(Math.random()*CX_CITY_OLD.length)];
    var fake=shuffleArr(CX_CITY_OLD.filter(function(x){return x[0]!==it2[0]}).slice(0,3).map(function(x){return x[0]}));
    var opts2=shuffleArr([it2[0]].concat(fake));
    q={title:'古称「'+it2[1].split('/')[0]+'」是现在的哪座城市？',opts:opts2,ans:it2[0],tip:it2[1].split('/')[0]+' → '+it2[0]+'（其他古称：'+it2[1]+'）'};
  }else if(kind==='dizhi'){ // 地支 / 生肖 / 顺序
    var i=Math.floor(Math.random()*CX_DIZHI.length);
    var real=CX_DIZHI[i]+'（'+CX_SHENGXIAO[i]+'）';
    var fake=[];
    while(fake.length<3){
      var j=Math.floor(Math.random()*CX_DIZHI.length); if(j===i||fake.indexOf(j)>=0) continue;
      fake.push(j);
    }
    var opts3=shuffleArr([real].concat(fake.map(function(k){return CX_DIZHI[k]+'（'+CX_SHENGXIAO[k]+'）'})));
    q={title:'地支第 '+(i+1)+' 位（十二生肖对应）是？',opts:opts3,ans:real,
      tip:'天干：甲乙丙丁戊己庚辛壬癸（10）\n地支：子丑寅卯辰巳午未申酉戌亥（12）→ '+(i+1)+'位是 '+real};
  }else if(kind==='solar'){ // 24节气

function dailyPick(arr,n){
  var seed=Math.floor(Date.now()/86400000)+exAccuShift;
  var out=[],start=((seed*n)%arr.length+arr.length)%arr.length;
  for(var i=0;i<Math.min(n,arr.length);i++)out.push(arr[(start+i)%arr.length]);
  return out;
}

function rExRec(){
  var h='<div class="card"><div class="rowline"><h3>🎙 背诵本</h3><div style="display:flex;gap:6px;align-items:center;flex:none"><button class="btn sm pk" onclick="openRecite()">＋ 背诵</button><button class="btn sm pp" onclick="openNorm()">📝 规范词</button></div></div>'
    +'<div class="tabs" style="padding-bottom:4px">';
  var fs=[['','全部'],['sz','📰时政'],['sc','💡素材'],['cy','📜成语'],['cx','🧠常识'],['gf','📝规范词']]
    .concat(SUBJ.map(function(s){return [s.k,s.ic+s.n.slice(0,2)]}))
    .concat([['qt','🌸其他']]);
  fs.forEach(function(f){ h+='<button class="tab'+(exRecFilter===f[0]?' on':'')+'" onclick="exRecFilter=\''+f[0]+'\';render()">'+f[1]+'</button>'; });
  h+='</div><div class="tabs" style="padding-bottom:4px">';

  h+='</div><div class="dotline"></div>';
  var list=S.exam.recite.filter(function(r){
    if(exRecFilter&&r.cat!==exRecFilter) return false;
    if(exRecStatus==='0'&&r.ok) return false;
    if(exRecStatus==='1'&&!r.ok) return false;
    return true;
  });
  var inProgress=list.filter(function(r){return !r.ok});
  var mastered=list.filter(function(r){return r.ok});
  function recCards(arr,offset){
    return arr.map(function(r,idx){
      if(r.cat==='gf') return normRecCard(r);
      var open=exRecOpen===r.id;
      var topicLabel=r.topic?r.topic:recCatN(r.cat);
      return '<div class="norm-card">'
        +'<div class="norm-head">'

        +'<span class="norm-no">#'+(idx+offset+1)+(r.ok?' 已背熟':' 背诵')+'</span></div>'
        +'<div class="norm-prompt">'
        +'<span class="norm-label">标题 / 要点</span>'
        +'<div class="norm-desc"><b style="font-size:13.5px">'+esc(r.title||'未命名')+'</b></div></div>'
        +'<button class="btn sm pp norm-tg" onclick="toggleRecBody(this);event.stopPropagation()" data-rid="'+r.id+'">'+(open?'🙈 收起内容':'👀 看内容')+'</button>'
        +'<div class="norm-ans'+(open?' show':'')+'" data-rbody="'+r.id+'">'
        +'<span class="norm-label">背诵内容</span>'
        +'<div style="font-size:12.5px;color:var(--ink);line-height:1.7;white-space:pre-wrap">'+esc(r.content||'（暂无内容）')+'</div>'
        +mediaHtml(r)
        +'</div>'
        +'<div class="chips" style="margin-top:8px">'
          +'<button class="chip" onclick="event.stopPropagation();editRecite(\''+r.id+'\')">✏️ 编辑</button>'
          +'<button class="chip '+(r.ok?'on':'pk')+'" onclick="tgRecite(\''+r.id+'\');event.stopPropagation()">'+(r.ok?'✅ 已背熟':'○ 背诵中')+'</button>'
          +'<button class="del" onclick="rmRecite(\''+r.id+'\');event.stopPropagation()">✕</button></div></div>';
    }).join('');
  }
  if(!list.length){ h+=emptyHtml('🎤','背诵本空空如也'); return h+'</div>'; }
  if(inProgress.length){
    h+='<div style="display:flex;align-items:center;gap:8px;margin:10px 0 6px"><b style="font-size:12px;color:var(--ink-2)">📖 背诵中</b><span class="pill pk" style="font-size:10px">'+inProgress.length+'</span><div style="flex:1;height:1.5px;background:linear-gradient(90deg,var(--line),transparent)"></div></div>';
    h+=recCards(inProgress,0);
  }
  if(mastered.length){
    h+='<div style="display:flex;align-items:center;gap:8px;margin:14px 0 6px"><b style="font-size:12px;color:var(--teal-d)">✅ 已背熟</b><span class="pill pp on" style="font-size:10px">'+mastered.length+'</span><div style="flex:1;height:1.5px;background:linear-gradient(90deg,var(--teal-l),transparent)"></div></div>';
    h+=recCards(mastered,inProgress.length);
  }
  return h+'</div>';
}

function saveEditRecite(id){

function engStreak(){
  var n=0, d=new Date(), t=today();
  if(!(S.eng.checkins[t]>0)) d.setDate(d.getDate()-1);
  while(true){
    var s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(S.eng.checkins[s]>0){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

  var h='<div class="card"><div class="rowline"><h3>💡 AI 护肤建议</h3><button class="btn sm pp" onclick="genSkinAdvice()">🔄 刷新建议</button></div><div class="dotline"></div>';
