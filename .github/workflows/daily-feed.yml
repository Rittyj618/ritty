name: 每日时政推送

on:
  schedule:
    # 每天北京时间 06:00（UTC 22:00 前一天）
    - cron: '0 22 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 生成时政推送
        id: gen
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: node scripts/generate-feed.mjs

      - name: 提交并推送
        run: |
          git config user.email "ritty-bot@users.noreply.github.com"
          git config user.name "Ritty Bot"
          git add index.html
          git commit -m "每日推送: $(date -u -d '+8 hours' '+%Y-%m-%d')" || echo "无变更"
          git push
